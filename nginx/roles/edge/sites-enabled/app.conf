# Bootstrap adapts listeners, TLS certificates and body limits to the official contract.
server {
    listen @@NGINX_PORT@@ default_server;
    server_name _;
    include /etc/nginx/snippets/static-root.conf;

    location / {
        include /etc/nginx/snippets/proxy-app.conf;
        proxy_pass http://app;
    }

    # Add verified static locations here; see snippets/static-cache.conf.
    # For SSE, send X-Accel-Buffering: no from Go or disable buffering only
    # in its dedicated location. Preserve HTTP upgrade headers for WebSockets.
}
