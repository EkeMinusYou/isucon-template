proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Never accept client-provided measurement identities as trusted input.
proxy_set_header X-Measurement-Session-ID "";
proxy_set_header X-Measurement-Request-Body-Bytes "";
proxy_hide_header X-Measurement-Session-ID;
proxy_hide_header X-Measurement-Request-Body-Bytes;
# Do not retry an accepted state change on a different Go process.
proxy_next_upstream off;
