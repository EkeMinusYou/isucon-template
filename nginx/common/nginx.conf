user www-data;
worker_processes auto;
worker_rlimit_nofile 16384;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    server_tokens off;
    keepalive_requests 1000000;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    # Optional application measurements are null when unavailable.
    map $upstream_http_x_measurement_request_body_bytes $measured_body_bytes {
        default null;
        ~^[0-9]+$ $upstream_http_x_measurement_request_body_bytes;
    }
    map $http_content_length $request_content_length {
        default null;
        ~^[0-9]+$ $http_content_length;
    }
    log_format json escape=json
        '{"msec":"$msec","method":"$request_method","uri":"$request_uri",'
        '"status":$status,"response_time":$request_time,"body_bytes":$body_bytes_sent,'
        '"request_body_bytes":$measured_body_bytes,"request_content_length":$request_content_length,'
        '"session_id":"$upstream_http_x_measurement_session_id",'
        '"connection":"$connection","connection_requests":"$connection_requests",'
        '"ssl_session_reused":"$ssl_session_reused",'
        '"upstream_addr":"$upstream_addr","upstream_response_time":"$upstream_response_time"}';
    access_log @@ACCESS_LOG_PATH@@ json buffer=32k flush=1s;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
