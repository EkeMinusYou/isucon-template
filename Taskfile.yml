# ISUCON redesign template — deployment, measurement, and analysis
#
# Update the variables in the first section at the start of each contest.
version: '3'

dotenv: ['.env.local']

# Contest-specific tasks live in Taskfile.contest.yml and are flattened into
# this namespace, so the generic graph below never names a contest asset.
# Task names must not collide across the two files; the generic side calls into
# the contest side through hook tasks only.
includes:
  contest:
    taskfile: ./Taskfile.contest.yml
    flatten: true

vars:
  # >>> contest values >>>
  # 競技ごとに書き換える区画。template-diffはここをbackport候補として扱わない。
  # 区画の外は、次の競技でもそのまま使う既定値である。
  # setup-checkの前に、公式資料と実環境で全項目を確認する。
  APP_NAME: app
  SERVICE: app
  LISTEN_PORT: '8080'
  NGINX_PORT: '80'
  TARGET_OS: linux
  TARGET_ARCH: amd64
  # Optional Go PGO profile path for build/build-pgo; unset uses -pgo=auto (default.pgo).
  # PGO_PROFILE: '{{.ROOT_DIR}}/runs/<RUN_ID>/isucon-1-go-cpu.pprof'
  # Safety cap; normal collection stops with the benchmark, regardless of load timing.
  PROFILE_SECONDS: '3600'
  # Files required for initialization; list all files, or use 'none'.
  RESET_INPUTS: ''
  # The Go application implements this endpoint.
  INITIALIZE_PATH: /initialize
  CONFIG_CHECK_COMMAND: 'go -C {{.APP_DIR}} vet ./...'
  SETUP_SECRET_ALLOWLIST: ''
  # Services whose metrics and journals measurectl collects on every host.
  MANAGED_SERVICES: '{{.SERVICE}},nginx'
  # Setup inventories unused middleware units; nginx remains managed.
  DISABLED_SERVICES: mysql,mariadb,redis,redis-server,memcached,pdns
  ACCESS_LOG_PATH: /var/log/nginx/access.log
  # <<< contest values <<<

  SSH_USER: ubuntu
  ISUCON_USER: isucon
  APP_DIR: webapp/go
  STATIC_DIR: public
  # Setup-only source checkout, excluded from the design workspace.
  REFERENCE_DIR: '{{.ROOT_DIR}}-reference'
  REMOTE_HOME: /home/isucon
  STATIC_REMOTE_DIR: '{{.REMOTE_HOME}}/public'
  SETUP_WEBAPP_EXCLUDES: '{{default "tools/setup/webapp-excludes.txt" .CONTEST_WEBAPP_EXCLUDES}}'

  SSH_MUX: -o UpdateHostKeys=no -o BatchMode=yes -o ConnectTimeout=10 -o ControlMaster=auto -o ControlPath=/tmp/.isucon-ssh-%C -o ControlPersist=600
  SSH: ssh -o RequestTTY=no -o LogLevel=ERROR {{.SSH_MUX}}
  RSYNC: rsync -az --rsync-path="sudo rsync" -e "ssh -o RequestTTY=no -o LogLevel=ERROR {{.SSH_MUX}}"
  GO_BUILD_ENV: CGO_ENABLED=0 GOOS={{.TARGET_OS}} GOARCH={{.TARGET_ARCH}}

  # >>> contest values >>>
  # Contest topology. Keep host roles and private addresses here only.
  ALL_HOSTS: isucon-1 isucon-2 isucon-3
  IP:
    map:
      isucon-1: 172.31.0.126
      isucon-2: 172.31.7.50
      isucon-3: 172.31.5.116
  APP_HOSTS: isucon-1
  APP_TRAFFIC_HOSTS: isucon-1
  NGINX_HOSTS: isucon-1
  # Optional overrides; unlisted hosts use role=edge and APP_TRAFFIC_HOSTS.
  # Example: isucon-2: {role: edge, app_hosts: [isucon-2, isucon-3]}
  NGINX_HOST_CONFIG:
    map: {}
  CONF_SRC: isucon-1
  # Additional Go services can declare their roles and deployment variables here.
  DEPLOYCTL_FLAGS: ''
  # Extra systemd unit:role pairs, appended to the mandatory nginx role check.
  CONTEST_SERVICE_ROLES: ''
  # Optional extra measurectl roles referenced by contest collectors/digesters.
  # CONTEST_MEASURECTL_ROLES: >-
  #   -role matcher={{splitList " " .MATCHER_HOSTS | join ","}}
  # <<< contest values <<<

  ENTRY_HOST: '{{splitList " " .NGINX_HOSTS | first}}'
  ENTRY_IP: '{{index .IP .ENTRY_HOST}}'
  APP_IPS: '{{$ips := list}}{{range (splitList " " .APP_TRAFFIC_HOSTS)}}{{$ips = append $ips (index $.IP .)}}{{end}}{{join " " $ips}}'
  ALL_HOST_IPS: '{{range (splitList " " .ALL_HOSTS)}}{{.}}={{index $.IP .}} {{end}}'

  # >>> contest values >>>
  # Portal request, auth headers, result fields and completion rules for task bench.
  CONTEST_PORTAL_BENCH_CONFIG: tools/contest/portal-bench.json
  # <<< contest values <<<

  RESULT_DIR: runs
  RAW_DIR: raw
  RUN_STATE_FILE: '{{.RAW_DIR}}/current-run-id'
  ANALYSIS_DB: runs/analysis.duckdb
  ANALYSIS_CONFIG: tools/analysis/sources.yaml
  # >>> contest values >>>
  DEPLOYCTL_CONFIG: tools/deployctl/deployments.yaml
  # <<< contest values <<<

  MEASUREMENT_DIR: tools/measurement
  PROC_METRICS_DIR: '{{.MEASUREMENT_DIR}}/cmd/proc-metrics'
  PPROF_BASE_URL: http://127.0.0.1:6060/debug/pprof
  PROFILE_STATUS_URL: http://127.0.0.1:6060/debug/profiles/status
  SNAPSHOT_PROFILE_URL: http://127.0.0.1:6060/debug/profiles/snapshots
  PROFILE_STOP_URL: http://127.0.0.1:6060/debug/profiles/stop
  # Standard measurement; setup must install the endpoint adapter before a RUN.
  PROFILES_ENABLED: 'true'
  PROFILE_DELAY: 0s
  FGPROF_URL: 'http://127.0.0.1:6060/debug/fgprof?seconds={{.PROFILE_SECONDS}}'
  PROFILE_TIMEOUT_SECONDS: '{{add (int .PROFILE_SECONDS) 15}}'
  PROFILE_READY_TIMEOUT_SECONDS: '15'
  JSON_METRICS_COLLECTOR_DIR: '{{.MEASUREMENT_DIR}}/cmd/json-metrics-collector'
  RUNTIME_METRICS_DIR: '{{.MEASUREMENT_DIR}}/cmd/runtime-metrics'
  USER_TRANSITION_METRICS_DIR: tools/user-transition-metrics
  MEASURECTL_DIR: tools/measurectl
  DEPLOYCTL_DIR: tools/deployctl
  ANALYSISCTL_DIR: tools/analysisctl
  BROWSER_TOOLS_DIR: tools/browser

  MEASURECTL_FLAGS: ''
  MEASURECTL_COLLECTORS_CONFIG: '{{default "tools/measurectl/collectors.yaml" .CONTEST_COLLECTORS_CONFIG}}'
  MEASURECTL_DIGESTERS_CONFIG: '{{default "tools/measurectl/digesters.yaml" .CONTEST_DIGESTERS_CONFIG}}'
  MEASURECTL_DIGEST_FLAGS: ''
  MEASURECTL_SSH: '-ssh-user {{.SSH_USER}} -ssh-opts "{{.SSH_MUX}}"'
  MEASURECTL_ROLES: >-
    -role all={{splitList " " .ALL_HOSTS | join ","}}
    -role app={{splitList " " .APP_HOSTS | join ","}}
    -role app_traffic={{splitList " " .APP_TRAFFIC_HOSTS | join ","}}
    -role ingress={{splitList " " .NGINX_HOSTS | join ","}}
    -role nginx={{splitList " " .NGINX_HOSTS | join ","}}
    -role entry={{.ENTRY_HOST}}
    {{default "" .CONTEST_MEASURECTL_ROLES}}
  MEASURECTL_VARS: >-
    -var services={{.MANAGED_SERVICES}}
    -var app_service={{.SERVICE}}
    -var pprof_base_url={{.PPROF_BASE_URL}}
    -var runtime_metrics_url=http://127.0.0.1:6060/debug/runtime
    -var access_log_path={{.ACCESS_LOG_PATH}}
    -var profile_status_url={{.PROFILE_STATUS_URL}}
    -var profile_stop_url={{.PROFILE_STOP_URL}}
    -var profile_ready_timeout_seconds={{.PROFILE_READY_TIMEOUT_SECONDS}}
    -var fgprof_url={{.FGPROF_URL}}
    -var profile_delay={{.PROFILE_DELAY}}
    -var snapshot_profile_url={{.SNAPSHOT_PROFILE_URL}}
    -var profile_seconds={{.PROFILE_SECONDS}}
    -var profile_timeout_seconds={{.PROFILE_TIMEOUT_SECONDS}}
  MEASURECTL_REMOTE: '{{.MEASURECTL_SSH}} {{.MEASURECTL_ROLES}} {{.MEASURECTL_VARS}}'
  MEASURECTL_COMMON: '{{.MEASURECTL_FLAGS}} {{.MEASURECTL_REMOTE}}'

  # Server-changing commands and benchmark runs share one lock.
  OPERATION_LOCK: sh tools/bench/operation-lock.sh
  PORTAL_BENCH_CONFIG: '{{default "" .CONTEST_PORTAL_BENCH_CONFIG}}'

  DEPLOYCTL_COMMON: >-
    {{.DEPLOYCTL_FLAGS}}
    -ssh-user {{.SSH_USER}}
    -ssh-opts "{{.SSH_MUX}}"
    -run-state-file {{.RUN_STATE_FILE}}
    -role all={{splitList " " .ALL_HOSTS | join ","}}
    -role app={{splitList " " .APP_HOSTS | join ","}}
    -role app_init={{splitList " " .APP_HOSTS | first}}
    -role nginx={{splitList " " .NGINX_HOSTS | join ","}}
    -var nginx_hosts={{splitList " " .NGINX_HOSTS | join ","}}
    -var extra_service_roles=nginx:nginx{{if .CONTEST_SERVICE_ROLES}},{{.CONTEST_SERVICE_ROLES}}{{end}}
    -var listen_port={{.LISTEN_PORT}}
    -var initialize_path={{.INITIALIZE_PATH}}
    -var remote_home={{.REMOTE_HOME}}
    -var isucon_user={{.ISUCON_USER}}
    -var service={{.SERVICE}}
    -var app_dir={{.APP_DIR}}
    -var static_dir={{.STATIC_DIR}}
    -var static_remote_dir={{.STATIC_REMOTE_DIR}}
    -var disabled_services={{.DISABLED_SERVICES}}
    -var app_hosts={{splitList " " .APP_HOSTS | join ","}}

  SCORE: ''
  RUN_ID:
    sh: date +%Y%m%d-%H%M%S
  RUN_DIR: '{{.RESULT_DIR}}/{{.RUN_ID}}'
  LATEST_RUN:
    sh: find runs -mindepth 1 -maxdepth 1 -type d -name '[0-9]*' -print 2>/dev/null | sort | tail -1
  RUN: '{{.LATEST_RUN}}'

tasks:
  default:
    desc: 現在の役割とタスク一覧を表示
    silent: true
    cmds:
      - |
        echo "現在の役割:"
        echo "  APP   : {{.APP_HOSTS}} (traffic={{.APP_TRAFFIC_HOSTS}})"
        echo "  NGINX : {{.NGINX_HOSTS}}"
        echo "  ENTRY : {{.ENTRY_HOST}} {{.ENTRY_IP}}"
        echo "  最新RUN: {{if .RUN}}{{.RUN}}{{else}}なし{{end}}"
        echo
      - task --list

  setup:
    desc: 汎用Go実装先を準備し旧ソースを別の調査用領域へ取得する
    cmds:
      - mkdir -p '{{.APP_DIR}}' docs/official
      - task: setup-webapp
      - task: setup-nginx
      - echo "setupで振る舞いをdocs/behavior.mdへ整理し、bootstrapは別セッションで開始してください。"

  prepare-reference:
    internal: true
    env:
      ISUCON_REFERENCE_DIR: '{{.REFERENCE_DIR}}'
      ISUCON_PROJECT_DIR: '{{.ROOT_DIR}}'
    preconditions:
      - sh: >-
          python3 -c 'import os; from pathlib import Path;
          ref=Path(os.environ["ISUCON_REFERENCE_DIR"]).resolve();
          root=Path(os.environ["ISUCON_PROJECT_DIR"]).resolve();
          assert ref != root and root not in ref.parents, "REFERENCE_DIR must be outside the design repository"'
        msg: REFERENCE_DIR must be outside the design repository
    cmds:
      - mkdir -p '{{.REFERENCE_DIR}}'

  setup-webapp:
    desc: setup専用の旧ソースをREFERENCE_DIRへ取得する
    deps: [prepare-reference]
    preconditions:
      - sh: test -f '{{.SETUP_WEBAPP_EXCLUDES}}'
        msg: SETUP_WEBAPP_EXCLUDES must name an existing rsync exclude file
    cmds:
      - mkdir -p '{{.REFERENCE_DIR}}/webapp'
      - '{{.RSYNC}} --exclude-from="{{.SETUP_WEBAPP_EXCLUDES}}" {{.SSH_USER}}@{{.CONF_SRC}}:{{.REMOTE_HOME}}/webapp/ {{.REFERENCE_DIR}}/webapp/'

  setup-nginx:
    desc: 旧nginx設定をsetup調査専用領域へ取得（新構成の設定は上書きしない）
    deps: [prepare-reference]
    cmds:
      - mkdir -p '{{.REFERENCE_DIR}}/nginx'
      - '{{.RSYNC}} --exclude=tls/ {{.SSH_USER}}@{{.CONF_SRC}}:/etc/nginx/ {{.REFERENCE_DIR}}/nginx/'

  setup-systemd:
    desc: setupで運用条件を調べるためのunitをREFERENCE_DIRへ取得する
    deps: [prepare-reference]
    cmds:
      - mkdir -p '{{.REFERENCE_DIR}}/etc/systemd/system'
      - '{{.RSYNC}} {{.SSH_USER}}@{{.CONF_SRC}}:/etc/systemd/system/{{.SERVICE}}.service {{.REFERENCE_DIR}}/etc/systemd/system/'

  setup-sysctl:
    desc: setupで確認するsysctl設定をREFERENCE_DIRへ取得する
    deps: [prepare-reference]
    cmds:
      - mkdir -p '{{.REFERENCE_DIR}}/etc'
      - '{{.RSYNC}} {{.SSH_USER}}@{{.CONF_SRC}}:/etc/sysctl.conf {{.REFERENCE_DIR}}/etc/'

  build:
    desc: GoアプリをローカルでTARGET_OS/TARGET_ARCHへクロスコンパイル
    dir: '{{.APP_DIR}}'
    cmds:
      - '{{.GO_BUILD_ENV}} go build -pgo "{{default "auto" .PGO_PROFILE}}" -trimpath -ldflags "-s -w" -o {{.APP_NAME}} .'
      - task: build-contest-assets

  build-pgo:
    desc: 指定profileまたはdefault.pgoを使ってGoアプリをビルド
    dir: '{{.APP_DIR}}'
    cmds:
      - '{{.GO_BUILD_ENV}} go build -pgo "{{default "auto" .PGO_PROFILE}}" -trimpath -ldflags "-s -w" -o {{.APP_NAME}} .'
      - task: build-contest-assets

  build-proc-metrics:
    internal: true
    silent: true
    dir: '{{.PROC_METRICS_DIR}}'
    sources: ['*.go', ../../go.mod, ../../go.sum]
    generates: [proc-metrics]
    cmds: ['{{.GO_BUILD_ENV}} go build -trimpath -ldflags "-s -w" -o proc-metrics .']

  build-json-metrics-collector:
    desc: optional JSON snapshot metrics collectorをTARGET_OS/TARGET_ARCHへビルド
    dir: '{{.JSON_METRICS_COLLECTOR_DIR}}'
    sources: ['*.go', ../../go.mod, ../../go.sum]
    generates: [json-metrics-collector]
    cmds: ['{{.GO_BUILD_ENV}} go build -trimpath -ldflags "-s -w" -o json-metrics-collector .']

  build-user-transition-metrics:
    desc: Cookie由来のユーザー遷移集計ツールをローカルでビルド
    silent: true
    dir: '{{.USER_TRANSITION_METRICS_DIR}}'
    sources: ['*.go', go.mod]
    generates: [user-transition-metrics]
    cmds: ['go build -trimpath -ldflags "-s -w" -o user-transition-metrics .']

  build-measurectl:
    internal: true
    silent: true
    dir: '{{.MEASURECTL_DIR}}'
    sources: ['*.go', go.mod, go.sum, ../measurement/profileseries/*.go, collectors.yaml, digesters.yaml]
    generates: [measurectl]
    cmds: ['go build -trimpath -ldflags "-s -w" -o measurectl .']

  build-bench-output:
    desc: ベンチ結果の出力変換ツールをローカル向けにビルド
    silent: true
    dir: tools/bench-output
    sources: ['*.go', go.mod]
    generates: [bench-output]
    cmds: ['go build -trimpath -ldflags "-s -w" -o bench-output .']

  build-portal-bench:
    desc: 汎用ポータルベンチツールをローカル向けにビルド
    silent: true
    dir: tools/portal-bench
    sources: ['*.go', go.mod]
    generates: [portal-bench]
    cmds: ['go build -trimpath -ldflags "-s -w" -o portal-bench .']

  build-deployctl:
    internal: true
    silent: true
    dir: '{{.DEPLOYCTL_DIR}}'
    sources: ['*.go', go.mod, go.sum, deployments.yaml]
    generates: [deployctl]
    cmds: ['go build -trimpath -ldflags "-s -w" -o deployctl .']

  build-analysisctl:
    internal: true
    silent: true
    dir: '{{.ANALYSISCTL_DIR}}'
    sources: ['*.go', internal/pprofimport/*.go, ../measurement/profileseries/*.go, go.mod, go.sum, ../analysis/sources.yaml, ../analysis/schema/*.sql, ../contest/analysis-schema/*.sql]
    generates: [analysisctl]
    cmds: ['go build -trimpath -ldflags "-s -w" -o analysisctl .']

  build-runtime-metrics:
    desc: Go runtime指標collectorを対象ホスト向けにビルド
    dir: '{{.RUNTIME_METRICS_DIR}}'
    sources: ['*.go', ../../go.mod, ../../go.sum]
    generates: [runtime-metrics]
    cmds: ['{{.GO_BUILD_ENV}} go build -trimpath -ldflags "-s -w" -o runtime-metrics .']

  build-measurement:
    desc: 共通moduleの全計測collectorをTARGET_OS/TARGET_ARCHへビルド
    deps: [build-proc-metrics, build-runtime-metrics, build-json-metrics-collector]

  test-measurement:
    desc: 共通計測moduleのprofile・endpoint・collectorをローカルで検証
    dir: '{{.MEASUREMENT_DIR}}'
    cmds: [go test -race ./...]

  test-go-profiles:
    desc: 共通moduleのGo profileのRUN別停止・正常出力・採取上限を検証
    dir: '{{.MEASUREMENT_DIR}}'
    cmds: [go test -race -run '^TestProfile' ./app]

  test-app:
    desc: 汎用Goサーバーの起動・計測分離・終了処理を検証
    dir: '{{.APP_DIR}}'
    cmds: [go test -race ./...]

  test-nginx:
    desc: ホスト別nginx設定の生成を検証（NGINX_TEST_IMAGE指定時はDockerでも検証）
    cmds: [python3 -m unittest discover -s tools/nginx -p 'test_*.py']

  test-measurectl:
    desc: 計測制御ツールをローカルで検証
    dir: '{{.MEASURECTL_DIR}}'
    cmds: [go test -race ./...]

  test-tools:
    desc: 全Goツールのテストを実行
    cmds:
      - for: { var: TOOL_MODULES }
        cmd: cd {{.ITEM}} && go test ./...
    vars:
      TOOL_MODULES:
        sh: find tools -name go.mod -not -path '{{default "" .TOOL_MODULE_EXCLUDE}}' -exec dirname {} \; | sort

  template-diff:
    desc: templateへ反映すべき差分をtools/template/paths.txtの範囲で表示する（DETAIL=1で差分本文）
    silent: true
    cmds:
      - DETAIL='{{.DETAIL}}' bash tools/template/diff.sh '{{.TEMPLATE_DIR | default "../isucon-template-redesign"}}'

  inspect-hosts:
    desc: 初期実装の内部構成を表示せずホスト資源だけを確認
    cmds:
      - for: { var: ALL_HOSTS }
        cmd: |
          echo "[{{.ITEM}}]"
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -u
            hostname
            uname -srmo
            command -v nproc >/dev/null 2>&1 && nproc || true
            command -v free >/dev/null 2>&1 && free -h || true
            command -v ip >/dev/null 2>&1 && ip -brief address || true
            df -h
            command -v lscpu >/dev/null 2>&1 && lscpu || true
          '

  setup-preflight:
    desc: 初期化前のローカル資材・nginx/Go role・reset plan確認
    deps: [build-deployctl]
    env:
      ISUCON_ALL_HOSTS: '{{.ALL_HOSTS}}'
      ISUCON_APP_HOSTS: '{{.APP_HOSTS}}'
      ISUCON_NGINX_HOSTS: '{{.NGINX_HOSTS}}'
      ISUCON_APP_TRAFFIC_HOSTS: '{{.APP_TRAFFIC_HOSTS}}'
      ISUCON_HOST_IPS: '{{.ALL_HOST_IPS}}'
      ISUCON_APP_DIR: '{{.APP_DIR}}'
      ISUCON_SERVICE: '{{.SERVICE}}'
      ISUCON_RESET_INPUTS: '{{.RESET_INPUTS}}'
    cmds:
      # Contest hook may generate local initialization inputs; it must not change remote state.
      - task: prepare-initial-data
      - task: gen
      - |
        set -u
        failures=0
        fail() { echo "setup-preflight: $*" >&2; failures=$((failures + 1)); }
        contains_host() { case " $1 " in *" $2 "*) return 0;; *) return 1;; esac; }

        for tool in task go python3 ssh rsync; do
          command -v "$tool" >/dev/null 2>&1 || fail "required local tool is missing: $tool"
        done
        if ! find docs/official -type f ! -name README.md -print -quit 2>/dev/null | grep -q .; then
          fail "docs/official has no contest manual or application specification"
        fi

        [ -n "$ISUCON_ALL_HOSTS" ] || fail "ALL_HOSTS is empty"
        [ -n "$ISUCON_APP_HOSTS" ] || fail "APP_HOSTS is empty"
        [ -n "$ISUCON_NGINX_HOSTS" ] || fail "NGINX_HOSTS is empty"
        [ -n "$ISUCON_APP_TRAFFIC_HOSTS" ] || fail "APP_TRAFFIC_HOSTS is empty"
        for host in $ISUCON_APP_HOSTS $ISUCON_APP_TRAFFIC_HOSTS $ISUCON_NGINX_HOSTS; do
          contains_host "$ISUCON_ALL_HOSTS" "$host" || fail "role host is not in ALL_HOSTS: $host"
        done
        for host in $ISUCON_APP_TRAFFIC_HOSTS; do
          contains_host "$ISUCON_APP_HOSTS" "$host" || fail "traffic host is not in APP_HOSTS: $host"
        done
        for host in $ISUCON_ALL_HOSTS; do
          case " $ISUCON_HOST_IPS " in *" $host="*) ;; *) fail "IP is not configured for $host";; esac
        done
        for pair in $ISUCON_HOST_IPS; do
          host=${pair%%=*}
          ip=${pair#*=}
          [ -n "$ip" ] || fail "IP is empty for $host"
          case "$ip" in 192.0.2.*|198.51.100.*|203.0.113.*) fail "documentation-only IP remains for $host: $ip";; esac
        done

        [ -d "$ISUCON_APP_DIR" ] || fail "application directory is missing: $ISUCON_APP_DIR"
        [ -f "generated/systemd/$ISUCON_SERVICE.service" ] || fail "application systemd unit is missing"
        [ -f etc/sysctl.conf ] || fail "sysctl configuration is missing"
        for host in $ISUCON_NGINX_HOSTS; do
          [ -f "generated/nginx/$host/nginx.conf" ] || fail "generated nginx configuration is missing for $host"
        done

        if [ "$ISUCON_RESET_INPUTS" = none ]; then
          : # Explicitly confirmed: no file input is required.
        elif [ -n "$ISUCON_RESET_INPUTS" ]; then
          for reset_input in $ISUCON_RESET_INPUTS; do
            [ -f "$reset_input" ] || fail "declared reset input is missing or is not a file: $reset_input"
          done
        else
          fail "list every local file read during initialization in RESET_INPUTS, or set it to 'none' after checking"
        fi

        [ "$failures" -eq 0 ] || exit 1
      - task: initialize-dry

  setup-check:
    desc: preflight後に設定構文・setup対象tool・成果物を確認
    deps: [setup-preflight]
    env:
      ISUCON_CONFIG_CHECK_COMMAND: '{{.CONFIG_CHECK_COMMAND}}'
      ISUCON_SECRET_ALLOWLIST: '{{.SETUP_SECRET_ALLOWLIST}}'
    cmds:
      - |
        set -u
        failures=0
        fail() { echo "setup-check: $*" >&2; failures=$((failures + 1)); }
        contains_host() { case " $1 " in *" $2 "*) return 0;; *) return 1;; esac; }

        for tool in alp zstd zstdcat duckdb; do
          command -v "$tool" >/dev/null 2>&1 || fail "required local tool is missing: $tool"
        done

        secret_candidates=''
        for root in webapp nginx etc; do
          [ -e "$root" ] || continue
          found=$(find "$root" -type f \( -name .env -o -name '*.key' -o -name '*private*.pem' -o -name debian.cnf \) -print 2>/dev/null || true)
          for candidate in $found; do
            if contains_host "$ISUCON_SECRET_ALLOWLIST" "$candidate"; then
              echo "setup-check: explicitly allowed credential-like file: $candidate" >&2
            else
              secret_candidates=$(printf '%s\n%s\n' "$secret_candidates" "$candidate")
            fi
          done
        done
        [ -z "$secret_candidates" ] || fail "credential-like files require an explicit keep/redact decision before commit:\n$secret_candidates"

        [ -n "$ISUCON_CONFIG_CHECK_COMMAND" ] || fail "CONFIG_CHECK_COMMAND is empty; configure local Go application checks"
        [ "$failures" -eq 0 ] || exit 1
      - sh -c "$ISUCON_CONFIG_CHECK_COMMAND"
      - task: build
      - task: test-app
      - task: test-nginx
      - task: test-tools
        vars:
          TOOL_MODULE_EXCLUDE: tools/dashboard/*
      - task: artifacts
      - task: deploy-app-dry
      - task: deploy-all-dry

  setup-postflight:
    desc: Check roles, internal connectivity, deployed files and collector cleanup
    deps: [build-deployctl, build-measurectl]
    cmds:
      - task: check-roles
      - task: check-network
      - '{{.DEPLOYCTL_DIR}}/deployctl verify -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'
      - '{{.MEASURECTL_DIR}}/measurectl collect check-clean -config {{.MEASURECTL_COLLECTORS_CONFIG}} {{.MEASURECTL_REMOTE}}'

  gen:
    desc: 共通・役割別nginx設定からホスト別配布物を生成
    silent: true
    env:
      ISUCON_ALL_HOSTS: '{{.ALL_HOSTS}}'
      ISUCON_NGINX_HOSTS: '{{.NGINX_HOSTS}}'
      ISUCON_APP_HOSTS: '{{.APP_HOSTS}}'
      ISUCON_APP_TRAFFIC_HOSTS: '{{.APP_TRAFFIC_HOSTS}}'
      ISUCON_HOST_ADDRESSES: '{{toJson .IP}}'
      ISUCON_NGINX_HOST_CONFIG: '{{toJson .NGINX_HOST_CONFIG}}'
      ISUCON_APP_PORT: '{{.LISTEN_PORT}}'
      ISUCON_NGINX_PORT: '{{.NGINX_PORT}}'
      ISUCON_STATIC_ROOT: '{{.STATIC_REMOTE_DIR}}'
      ISUCON_ACCESS_LOG_PATH: '{{.ACCESS_LOG_PATH}}'
    cmds:
      - python3 tools/nginx/generate.py
      - mkdir -p generated/systemd
      - |
        cat > 'generated/systemd/{{.SERVICE}}.service' <<'UNIT'
        [Unit]
        Description=ISUCON Go application
        After=network.target

        [Service]
        Type=simple
        User={{.ISUCON_USER}}
        WorkingDirectory={{.REMOTE_HOME}}/{{.APP_DIR}}
        ExecStart={{.REMOTE_HOME}}/{{.APP_DIR}}/{{.APP_NAME}}
        Environment=APP_ADDR=:{{.LISTEN_PORT}}
        Environment=MEASUREMENT_ADDR=127.0.0.1:6060
        Restart=on-failure
        TimeoutStopSec=15
        LimitNOFILE=65536

        [Install]
        WantedBy=multi-user.target
        UNIT
      - task: gen-contest-routing

  deploy:
    desc: GoアプリをビルドしてAPP_HOSTSへ配布・再起動
    preconditions: &no_active_run
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists; run task after-bench or task abort-run
    cmds:
      - task: build
      - task: deploy-app

  deploy-all:
    desc: 不要サービスを停止しnginx・Goアプリ・OS設定を反映
    preconditions: *no_active_run
    cmds:
      # Contest hook; a contest without prepared assets defines it as a no-op.
      - task: prepare-initial-data
      - task: gen
      - task: build
      - task: deploy-plan
        vars: { PLAN: deploy-all }

  initialize:
    desc: Goアプリの初期化APIで状態を初期化
    preconditions: *no_active_run
    deps: [setup-preflight]
    cmds:
      - task: deploy-plan
        vars: { PLAN: initialize }

  deploy-app-dry:
    desc: app deployの転送先・role・activationを実行せず表示
    deps: [gen, build-deployctl]
    cmds:
      # Contest hook; keep the dry-run input complete in a clean checkout.
      - task: prepare-initial-data
      - '{{.DEPLOYCTL_DIR}}/deployctl apply app -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-all-dry:
    desc: deploy-allの転送先・role・activation graphを実行せず表示
    deps: [build-deployctl]
    cmds:
      # Contest hook; keep the dry-run input complete in a clean checkout.
      - task: prepare-initial-data
      - task: gen
      - task: build
      - '{{.DEPLOYCTL_DIR}}/deployctl apply-plan deploy-all -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-app:
    desc: アプリをAPP_HOSTSへ配布・再起動
    preconditions: *no_active_run
    deps: [gen, build, build-deployctl]
    cmds:
      # Contest hook; the app initialize script consumes these generated files.
      - task: prepare-initial-data
      - '{{.OPERATION_LOCK}} {{.DEPLOYCTL_DIR}}/deployctl apply app -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-nginx-dry:
    desc: nginxと静的資材の配布・検証・反映計画を表示
    deps: [gen, build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl apply nginx -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-nginx:
    desc: nginx設定をNGINX_HOSTSへ配布・検証・reload
    preconditions: *no_active_run
    deps: [gen, build-deployctl]
    cmds:
      - '{{.OPERATION_LOCK}} {{.DEPLOYCTL_DIR}}/deployctl apply nginx -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-sysctl:
    desc: sysctl設定を全ホストへ配布・反映
    preconditions: *no_active_run
    deps: [build-deployctl]
    cmds:
      - '{{.OPERATION_LOCK}} {{.DEPLOYCTL_DIR}}/deployctl apply sysctl -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-plan:
    internal: true
    deps: [build-deployctl]
    requires: { vars: [PLAN] }
    cmds:
      - '{{.OPERATION_LOCK}} {{.DEPLOYCTL_DIR}}/deployctl apply-plan {{.PLAN}} -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  apply-roles:
    desc: 役割外サービスを停止し、役割内サービスを起動
    preconditions: *no_active_run
    deps: [gen, build-deployctl]
    cmds:
      - '{{.OPERATION_LOCK}} {{.DEPLOYCTL_DIR}}/deployctl apply-plan roles -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  check-network:
    desc: nginx入口・nginxからGoへの接続・競技固有経路を確認
    deps: [gen]
    silent: true
    cmds:
      - for: { var: APP_TRAFFIC_HOSTS }
        cmd: '{{.SSH}} {{.SSH_USER}}@{{.ITEM}} "timeout 2 bash -c \"</dev/tcp/127.0.0.1/{{.LISTEN_PORT}}\"" && echo "[{{.ITEM}}] app OK"'
      - for: { var: NGINX_HOSTS }
        cmd: '{{.SSH}} {{.SSH_USER}}@{{.ITEM}} "bash -s" < generated/nginx/_checks/{{.ITEM}}.sh'
      - task: check-contest-network

  check-roles:
    desc: service状態がTaskfileの役割定義と一致することを確認
    deps: [build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl check-roles {{.DEPLOYCTL_COMMON}}'

  compare-runs:
    desc: 保存済み2RUNの得点・標準集計・計測の欠損を比較（読み取り専用）
    silent: true
    requires: {vars: [BASE_RUN, NEW_RUN]}
    deps: [build-analysisctl]
    env:
      ISUCON_COMPARE_BASE: '{{.BASE_RUN}}'
      ISUCON_COMPARE_NEW: '{{.NEW_RUN}}'
      ISUCON_COMPARE_CHECK_ONLY: '{{default "false" .CHECK_ONLY}}'
    cmds:
      - '{{.ANALYSISCTL_DIR}}/analysisctl compare -check-only="$ISUCON_COMPARE_CHECK_ONLY" -config {{.ANALYSIS_CONFIG}} -db {{.ANALYSIS_DB}} -results {{.RESULT_DIR}} "$ISUCON_COMPARE_BASE" "$ISUCON_COMPARE_NEW"'

  test-bench-run:
    desc: 実サーバーを使わずベンチ回収・任意比較の制御を検証
    cmds: [python3 -m unittest discover -s tools/bench -p 'test_*.py']

  bench:
    desc: 計測開始→ベンチ→回収（BASE_RUN指定時は回収後に比較）
    silent: true
    deps: [build-portal-bench]
    env:
      ISUCON_BENCH_RUN_STATE_FILE: '{{.RUN_STATE_FILE}}'
      ISUCON_BENCH_RESULTS_DIR: '{{.RESULT_DIR}}'
      ISUCON_BENCH_COLLECT_FLAGS: '{{default "" .MEASURECTL_COLLECT_FLAGS}}'
      ISUCON_BENCH_PROFILES_ENABLED: '{{.PROFILES_ENABLED}}'
      ISUCON_BENCH_BASE_RUN: '{{default "" .BASE_RUN}}'
    cmds:
      - 'tools/portal-bench/portal-bench -config "{{.PORTAL_BENCH_CONFIG}}" -check'
      - '{{.OPERATION_LOCK}} sh tools/bench/run.sh -- tools/portal-bench/portal-bench -config "{{.PORTAL_BENCH_CONFIG}}"'

  portal-bench-check:
    desc: ポータル設定と認証変数を通信せず検証
    deps: [build-portal-bench]
    cmds:
      - 'tools/portal-bench/portal-bench -config "{{.PORTAL_BENCH_CONFIG}}" -check'

  before-bench:
    desc: 差分をcommitしてRUNを採番し、ログローテートとcollector起動を行う
    silent: true
    deps: [gen, build-measurectl, build-proc-metrics, build-runtime-metrics, build-deployctl]
    cmds:
      # Measure only what was deployed from the local source.
      - '{{.DEPLOYCTL_DIR}}/deployctl verify -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'
      - '{{.DEPLOYCTL_DIR}}/deployctl check-roles {{.DEPLOYCTL_COMMON}}'
      - |
        {{.OPERATION_LOCK}} bash <<'BASH'
        set -eu
        mkdir -p '{{.RAW_DIR}}'
        {{.MEASURECTL_DIR}}/measurectl run begin -collectors {{.MEASURECTL_COLLECTORS_CONFIG}} -digesters {{.MEASURECTL_DIGESTERS_CONFIG}} -commit-changes -run-id '{{.RUN_ID}}' \
          -profiles-enabled={{.PROFILES_ENABLED}} \
          -results '{{.RESULT_DIR}}' -raw-dir '{{.RAW_DIR}}' -run-state-file '{{.RUN_STATE_FILE}}' \
          -collector-flags '{{.MEASURECTL_FLAGS}} {{default "" .MEASURECTL_COLLECT_FLAGS}}' {{.MEASURECTL_REMOTE}}
        BASH

  after-bench:
    desc: 進行中RUNのcollector・ログ・集計・manifestを回収
    silent: true
    deps: [build-measurectl, build-user-transition-metrics, build-bench-output]
    vars:
      FINISH_RUN_ID:
        sh: sh tools/bench/active-run-id.sh '{{.RUN_STATE_FILE}}'
    cmds:
      - |
        {{.OPERATION_LOCK}} bash <<'BASH'
        set -eu
        result_markers=$(tools/bench-output/bench-output -input '{{.RESULT_DIR}}/{{.FINISH_RUN_ID}}/bench.log')
        if [ -n "$result_markers" ]; then
          printf '\n%s\n' "$result_markers" >> '{{.RESULT_DIR}}/{{.FINISH_RUN_ID}}/bench.log'
        fi
        BASH
      - >-
        {{.OPERATION_LOCK}} {{.MEASURECTL_DIR}}/measurectl run finalize -collectors {{.MEASURECTL_COLLECTORS_CONFIG}} -digesters {{.MEASURECTL_DIGESTERS_CONFIG}} -auto-commit -results '{{.RESULT_DIR}}' -raw-dir '{{.RAW_DIR}}'
        -run-state-file '{{.RUN_STATE_FILE}}' -scores '{{.RESULT_DIR}}/scores.tsv' -score '{{.SCORE}}'
        -collector-flags '{{.MEASURECTL_FLAGS}} {{default "" .MEASURECTL_COLLECT_FLAGS}}'
        -digester-flags '{{.MEASURECTL_DIGEST_FLAGS}}' {{.MEASURECTL_REMOTE}}
      - task: q-sync
        silent: true
      - '{{.MEASURECTL_DIR}}/measurectl artifacts -recorded -run-dir {{.RESULT_DIR}}/{{.FINISH_RUN_ID}}'

  profiles-collect:
    desc: 進行中RUNへ有効宣言のprofileを収集
    deps: [build-measurectl]
    vars:
      ACTIVE_RUN_ID:
        sh: sh tools/bench/active-run-id.sh '{{.RUN_STATE_FILE}}'
    cmds: ['{{.MEASURECTL_DIR}}/measurectl collect oneshot -config {{.MEASURECTL_COLLECTORS_CONFIG}} -group profiles -run-id {{.ACTIVE_RUN_ID}} -run-dir {{.RESULT_DIR}}/{{.ACTIVE_RUN_ID}} {{.MEASURECTL_REMOTE}}']

  profiles-ready:
    desc: 進行中RUNの有効なprofileの開始を全APP_HOSTSで確認
    silent: true
    deps: [build-measurectl]
    vars:
      ACTIVE_RUN_ID:
        sh: sh tools/bench/active-run-id.sh '{{.RUN_STATE_FILE}}'
    cmds: ['{{.MEASURECTL_DIR}}/measurectl collect ready -config {{.MEASURECTL_COLLECTORS_CONFIG}} -group profiles -run-id {{.ACTIVE_RUN_ID}} {{.MEASURECTL_REMOTE}}']

  profiles-stop:
    desc: 進行中RUNの有効なprofileへ停止を通知し、採取中のHTTP応答で書き出す
    deps: [build-measurectl]
    vars:
      ACTIVE_RUN_ID:
        sh: sh tools/bench/active-run-id.sh '{{.RUN_STATE_FILE}}'
    cmds: ['{{.MEASURECTL_DIR}}/measurectl collect oneshot-stop -config {{.MEASURECTL_COLLECTORS_CONFIG}} -group profiles -run-id {{.ACTIVE_RUN_ID}} {{.MEASURECTL_REMOTE}}']

  fgprof-collect:
    desc: 進行中RUNへfgprofを収集
    deps: [build-measurectl]
    vars:
      ACTIVE_RUN_ID:
        sh: sh tools/bench/active-run-id.sh '{{.RUN_STATE_FILE}}'
    cmds: ['{{.MEASURECTL_DIR}}/measurectl collect oneshot -config {{.MEASURECTL_COLLECTORS_CONFIG}} -only fgprof -run-id {{.ACTIVE_RUN_ID}} -run-dir {{.RESULT_DIR}}/{{.ACTIVE_RUN_ID}} {{.MEASURECTL_COMMON}}']

  go-profiles-collect:
    desc: 進行中RUNへGo CPU・heap・allocs・goroutine profileを並列収集
    deps: [build-measurectl]
    vars:
      ACTIVE_RUN_ID:
        sh: sh tools/bench/active-run-id.sh '{{.RUN_STATE_FILE}}'
    cmds: ['{{.MEASURECTL_DIR}}/measurectl collect oneshot -config {{.MEASURECTL_COLLECTORS_CONFIG}} -only go-cpu,go-heap,go-allocs,go-goroutine -run-id {{.ACTIVE_RUN_ID}} -run-dir {{.RESULT_DIR}}/{{.ACTIVE_RUN_ID}} {{.MEASURECTL_COMMON}}']

  go-profile-top:
    desc: 保存済みGo profileをgo tool pprof -topで表示（PROFILE=isucon-1-go-cpu.pprof）
    requires: { vars: [PROFILE] }
    preconditions:
      - sh: test -n '{{.RUN}}' -a -f '{{.RUN}}/{{.PROFILE}}'
        msg: 指定したGo profileがありません
    cmds: ['go tool pprof -top {{.RUN}}/{{.PROFILE}}']

  abort-run:
    desc: 進行中RUNを破棄しcollectorを掃除（破壊的）
    deps: [build-measurectl]
    cmds:
      - |
        {{.OPERATION_LOCK}} bash <<'BASH'
        set -eu
        sh tools/bench/active-run-id.sh '{{.RUN_STATE_FILE}}' >/dev/null
        {{.MEASURECTL_DIR}}/measurectl collect sweep -config {{.MEASURECTL_COLLECTORS_CONFIG}} {{.MEASURECTL_COMMON}}
        mv -f '{{.RUN_STATE_FILE}}' '{{.RAW_DIR}}/aborted-run-id'
        BASH

  artifacts:
    desc: 成果物宣言と読み手の整合を確認
    deps: [build-measurectl]
    cmds:
      - '{{.MEASURECTL_DIR}}/measurectl artifacts -check'

  artifacts-run:
    desc: 指定RUN（既定は最新）の必須成果物が揃っていることを確認
    deps: [build-measurectl]
    preconditions:
      - sh: test -n '{{.RUN}}' -a -d '{{.RUN}}'
        msg: 確認可能なRUNがありません
    cmds:
      - '{{.MEASURECTL_DIR}}/measurectl artifacts -recorded -run-dir {{.RUN}}'

  q:
    desc: 同期済み分析DBへの読み取り専用RUN横断DuckDBクエリ
    env:
      ISUCON_QUERY: '{{join " " .CLI_ARGS_LIST}}'
    cmds:
      - |
        if [ -n "$ISUCON_QUERY" ]; then
          duckdb -readonly '{{.ANALYSIS_DB}}' -c "$ISUCON_QUERY"
        else
          duckdb -readonly '{{.ANALYSIS_DB}}'
        fi

  q-sync:
    desc: finalized RUNを分析DBへ同期
    deps: [build-analysisctl]
    preconditions:
      - sh: find '{{.RESULT_DIR}}' -mindepth 1 -maxdepth 1 -type d -name '[0-9]*' | grep -q .
        msg: finalized RUNがありません。先にベンチ計測を回収してください
    cmds: ['{{.ANALYSISCTL_DIR}}/analysisctl sync -config {{.ANALYSIS_CONFIG}} -db {{.ANALYSIS_DB}} -results {{.RESULT_DIR}}']

  q-build:
    desc: 分析DBを全RUNから再構築
    deps: [build-analysisctl]
    preconditions:
      - sh: find '{{.RESULT_DIR}}' -mindepth 1 -maxdepth 1 -type d -name '[0-9]*' | grep -q .
        msg: finalized RUNがありません。先にベンチ計測を回収してください
    cmds: ['{{.ANALYSISCTL_DIR}}/analysisctl rebuild -config {{.ANALYSIS_CONFIG}} -db {{.ANALYSIS_DB}} -results {{.RESULT_DIR}}']

  topology-screen:
    desc: 保存済みaccess logをシャード候補ごとにオフライン集計
    dir: tools/topology-screen
    cmds: ['go run . -run-dir {{.ROOT_DIR}}/{{.RUN}} {{.CLI_ARGS}}']

  alp:
    desc: 指定RUN（既定は最新）のalp.txtを表示
    preconditions:
      - sh: test -n '{{.RUN}}' -a -f '{{.RUN}}/alp.txt'
        msg: alp.txtがあるRUNがありません
    cmds: ['cat {{.RUN}}/alp.txt']

  dashboard:
    desc: ローカル計測ダッシュボードを起動
    deps: [dashboard-server, dashboard-web]

  dashboard-server:
    internal: true
    dir: tools/dashboard/server
    cmds: ['go run . -root {{.ROOT_DIR}} -analysis-db {{.ROOT_DIR}}/{{.ANALYSIS_DB}} -addr 127.0.0.1:8091']

  dashboard-web:
    internal: true
    dir: tools/dashboard/web
    cmds:
      - test -d node_modules || npm ci
      - DASHBOARD_API_TARGET=http://127.0.0.1:8091 npm run dev -- --host 127.0.0.1 --port 5173 --strictPort

  browser-install:
    desc: dashboard確認用Playwright CLIをローカルへ導入
    dir: '{{.BROWSER_TOOLS_DIR}}'
    cmds:
      - npm ci --cache '{{.ROOT_DIR}}/.task/npm-cache'
      - npx playwright-cli install-browser

  status:
    desc: 全ホストのサービス状態
    cmds:
      - for: { var: ALL_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} \
            "systemctl is-active {{.SERVICE}} nginx | tr '\n' ' '; echo; uptime"

  logs:
    desc: APP_HOSTSのアプリログ
    cmds:
      - for: { var: APP_HOSTS }
        cmd: '{{.SSH}} {{.SSH_USER}}@{{.ITEM}} "sudo journalctl -u {{.SERVICE}} -n 80 --no-pager"'

  ssh:
    desc: 指定ホストへisuconユーザーでログイン（HOST=isucon-1）
    interactive: true
    vars: { HOST: '{{.HOST | default "isucon-1"}}' }
    cmds: ['{{.SSH}} -t {{.SSH_USER}}@{{.HOST}} "sudo -u {{.ISUCON_USER}} -i"']

  clear-cache:
    desc: 古いログとAPTキャッシュを削除（破壊的。明示指示時のみ）
    cmds:
      - for: { var: ALL_HOSTS }
        cmd: '{{.OPERATION_LOCK}} {{.SSH}} {{.SSH_USER}}@{{.ITEM}} "sudo journalctl --vacuum-size=10M && sudo apt-get clean"'

  initialize-dry:
    desc: Goアプリ初期化の対象とactivationを実行せず表示
    deps: [gen, build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl apply-plan initialize -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-app-unit-dry:
    desc: アプリのsystemd設定のみの転送・反映計画を表示
    deps: [gen, build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl apply app-unit -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-app-unit:
    desc: アプリのsystemd設定のみを反映し停止中なら起動
    preconditions: *no_active_run
    deps: [gen, build-deployctl]
    cmds:
      - '{{.OPERATION_LOCK}} {{.DEPLOYCTL_DIR}}/deployctl apply app-unit -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  bench-timestamp:
    desc: 計測対象の入口ホストのUTC時刻を返す（ベンチは実行しない）
    cmds:
      - '{{.SSH}} {{.SSH_USER}}@{{.ENTRY_HOST}} "date -u +%Y-%m-%dT%H:%M:%S.%NZ" </dev/null'

  config-check:
    desc: Goアプリのローカル検査
    cmds:
      - '{{.CONFIG_CHECK_COMMAND}}'
