# ISUCON template — deployment, measurement, and analysis
#
# Update the variables in the first section at the start of each contest.
version: '3'

dotenv: ['.env.local']

# Contest-specific tasks live in Taskfile.contest.yml and are flattened into
# this namespace, so the generic graph below never names a contest asset.
# Task names must not collide across the two files; the generic side calls into
# the contest side through hook tasks only.
includes:
  contest:
    taskfile: ./Taskfile.contest.yml
    flatten: true

vars:
  # >>> contest values >>>
  # 競技ごとに書き換える区画。template-diffはここをbackport候補として扱わない。
  # 区画の外は、次の競技でもそのまま使う既定値である。
  # setup-checkの前に、公式資料と実環境で全項目を確認する。
  APP_NAME: app
  SERVICE: app
  DB_NAME: app
  LISTEN_PORT: '8080'
  TARGET_OS: linux
  TARGET_ARCH: amd64
  # Optional Go PGO profile path for build/build-pgo; unset uses -pgo=auto (default.pgo).
  # PGO_PROFILE: '{{.ROOT_DIR}}/runs/<RUN_ID>/isucon-1-go-cpu.pprof'
  # Example budget: initialization + checks + load + margin. Tune for the contest.
  PROFILE_SECONDS: '120'
  SNAPSHOT_PROFILE_DELAY: 40s
  # Additional local files read during DB recreation or initialization; use 'none' if empty.
  RESET_INPUTS: ''
  # Adapt these reset assets and endpoint to the acquired official implementation.
  SQL_DIR: webapp/sql
  SQL_SCHEMA_FILE: schema.sql
  INITIALIZE_PATH: /initialize
  CONFIG_CHECK_COMMAND: ''
  CONFIG_CHECK_CONFIG: tools/setup/config-check.yaml
  SETUP_SECRET_ALLOWLIST: ''
  # Services whose metrics and journals measurectl collects on every host.
  MANAGED_SERVICES: '{{.SERVICE}},nginx,mysql'
  # <<< contest values <<<

  SSH_USER: ubuntu
  ISUCON_USER: isucon
  APP_DIR: webapp/go
  REMOTE_HOME: /home/isucon
  SETUP_WEBAPP_EXCLUDES: '{{default "tools/setup/webapp-excludes.txt" .CONTEST_WEBAPP_EXCLUDES}}'

  SSH_MUX: -o UpdateHostKeys=no -o BatchMode=yes -o ConnectTimeout=10 -o ControlMaster=auto -o ControlPath=/tmp/.isucon-ssh-%C -o ControlPersist=600
  SSH: ssh -o RequestTTY=no -o LogLevel=ERROR {{.SSH_MUX}}
  RSYNC: rsync -az --rsync-path="sudo rsync" -e "ssh -o RequestTTY=no -o LogLevel=ERROR {{.SSH_MUX}}"
  GO_BUILD_ENV: CGO_ENABLED=0 GOOS={{.TARGET_OS}} GOARCH={{.TARGET_ARCH}}

  # >>> contest values >>>
  # Contest topology. Keep host roles and private addresses here only.
  ALL_HOSTS: isucon-1 isucon-2 isucon-3
  IP:
    map:
      isucon-1: 172.31.0.126
      isucon-2: 172.31.7.50
      isucon-3: 172.31.5.116
  APP_HOSTS: isucon-1
  APP_TRAFFIC_HOSTS: isucon-1
  # The first nginx host owns the external entry; the matcher remains single.
  NGINX_HOSTS: isucon-2 isucon-3
  TLS_FORWARD_HOSTS: isucon-2
  TLS_BACKEND_PORT: '8443'
  TLS_ENTRY_INTERFACE: ens5
  # MYSQL_HOST is the detailed measurement source and default DB connection.
  MYSQL_HOST: isucon-3
  # Deployment and service enable/disable targets.
  MYSQL_HOSTS: '{{.MYSQL_HOST}}'
  MATCHER_HOSTS: isucon-2
  SOLVER_HOSTS: isucon-3
  SOLVER_PORT: '9090'
  PAYMENT_MOCK_HOSTS: '{{.APP_HOSTS}}'
  CONF_SRC: isucon-1
  # Extra deployctl roles and vars for contest-specific deployments.
  DEPLOYCTL_FLAGS: >-
    -role sql_assets={{concat (splitList " " .APP_HOSTS) (splitList " " .MYSQL_HOSTS) | uniq | join ","}}
    -role matcher={{splitList " " .MATCHER_HOSTS | join ","}}
    -role solver={{splitList " " .SOLVER_HOSTS | join ","}}
    -role payment_mock={{splitList " " .PAYMENT_MOCK_HOSTS | join ","}}
    -role tls_forward={{splitList " " .TLS_FORWARD_HOSTS | join ","}}
    -var matcher_hosts={{splitList " " .MATCHER_HOSTS | join ","}}
    -var solver_hosts={{splitList " " .SOLVER_HOSTS | join ","}}
    -var payment_mock_hosts={{splitList " " .PAYMENT_MOCK_HOSTS | join ","}}
    -var tls_forward_hosts={{splitList " " .TLS_FORWARD_HOSTS | join ","}}
    -var app_ip={{index .IP (splitList " " .APP_HOSTS | first)}}
    -var extra_service_roles=isuride-matcher:matcher,isuride-payment_mock:payment_mock,isuride-tls-forward:tls_forward,isuride-matching-worker:solver
  # Optional extra measurectl roles referenced by contest collectors/digesters.
  # CONTEST_MEASURECTL_ROLES: >-
  #   -role matcher={{splitList " " .MATCHER_HOSTS | join ","}}
  # <<< contest values <<<

  ENTRY_HOST: '{{splitList " " .NGINX_HOSTS | first}}'
  ENTRY_IP: '{{index .IP (splitList " " .NGINX_HOSTS | first)}}'
  MYSQL_IP: '{{if .MYSQL_HOST}}{{index .IP .MYSQL_HOST}}{{end}}'
  APP_IPS: '{{$ips := list}}{{range (splitList " " .APP_TRAFFIC_HOSTS)}}{{$ips = append $ips (index $.IP .)}}{{end}}{{join " " $ips}}'
  ALL_HOST_IPS: '{{range (splitList " " .ALL_HOSTS)}}{{.}}={{index $.IP .}} {{end}}'

  # >>> contest values >>>
  # Portal request, auth headers, result fields and completion rules for task bench.
  CONTEST_PORTAL_BENCH_CONFIG: tools/contest/portal-bench.json
  # <<< contest values <<<

  RESULT_DIR: runs
  RAW_DIR: raw
  RUN_STATE_FILE: '{{.RAW_DIR}}/current-run-id'
  ANALYSIS_DB: runs/analysis.duckdb
  ANALYSIS_CONFIG: tools/analysis/sources.yaml
  # >>> contest values >>>
  DEPLOYCTL_CONFIG: tools/contest/deployments.yaml
  # <<< contest values <<<

  MEASUREMENT_DIR: tools/measurement
  PROC_METRICS_DIR: '{{.MEASUREMENT_DIR}}/cmd/proc-metrics'
  MYSQL_METRICS_DIR: '{{.MEASUREMENT_DIR}}/cmd/mysql-metrics'
  NGINX_ONCPU_PROFILER_DIR: '{{.MEASUREMENT_DIR}}/cmd/nginx-oncpu-profiler'
  NGINX_ONCPU_HOST: '{{.ENTRY_HOST}}'
  NGINX_ONCPU_PROBE_URL: http://127.0.0.1/
  PPROF_BASE_URL: http://127.0.0.1:6060/debug/pprof
  PROFILE_STATUS_URL: http://127.0.0.1:6060/debug/profiles/status
  PROFILE_STOP_URL: http://127.0.0.1:6060/debug/profiles/stop
  # Standard measurement; setup must install the endpoint adapter before a RUN.
  PROFILES_ENABLED: 'true'
  PROFILE_DELAY: 0s
  FGPROF_URL: 'http://127.0.0.1:6060/debug/fgprof?seconds={{.PROFILE_SECONDS}}'
  PROFILE_TIMEOUT_SECONDS: '{{add (int .PROFILE_SECONDS) 15}}'
  PROFILE_READY_TIMEOUT_SECONDS: '15'
  NGINX_BACKEND_REPORT_DIR: tools/nginx-backend-report
  JSON_METRICS_COLLECTOR_DIR: '{{.MEASUREMENT_DIR}}/cmd/json-metrics-collector'
  SQL_POOL_METRICS_DIR: '{{.MEASUREMENT_DIR}}/cmd/sql-pool-metrics'
  USER_TRANSITION_METRICS_DIR: tools/user-transition-metrics
  MEASURECTL_DIR: tools/measurectl
  DEPLOYCTL_DIR: tools/deployctl
  ANALYSISCTL_DIR: tools/analysisctl
  BROWSER_TOOLS_DIR: tools/browser

  MEASURECTL_FLAGS: ''
  MEASURECTL_COLLECTORS_CONFIG: '{{default "tools/measurectl/collectors.yaml" .CONTEST_COLLECTORS_CONFIG}}'
  MEASURECTL_DIGESTERS_CONFIG: '{{default "tools/measurectl/digesters.yaml" .CONTEST_DIGESTERS_CONFIG}}'
  MEASURECTL_DIGEST_FLAGS: ''
  MEASURECTL_SSH: '-ssh-user {{.SSH_USER}} -ssh-opts "{{.SSH_MUX}}"'
  MEASURECTL_ROLES: >-
    -role all={{splitList " " .ALL_HOSTS | join ","}}
    -role app={{splitList " " .APP_HOSTS | join ","}}
    -role app_traffic={{splitList " " .APP_TRAFFIC_HOSTS | join ","}}
    -role nginx={{splitList " " .NGINX_HOSTS | join ","}}
    -role entry={{.ENTRY_HOST}}
    -role nginx_profile={{.ENTRY_HOST}}
    -role mysql={{.MYSQL_HOST}}
    -role mysql_all={{splitList " " .MYSQL_HOSTS | join ","}}
    {{default "" .CONTEST_MEASURECTL_ROLES}}
  MEASURECTL_VARS: >-
    -var services={{.MANAGED_SERVICES}}
    -var app_service={{.SERVICE}}
    -var pprof_base_url={{.PPROF_BASE_URL}}
    -var sql_pool_metrics_url=http://127.0.0.1:6060/debug/sql-pools
    -var profile_status_url={{.PROFILE_STATUS_URL}}
    -var profile_stop_url={{.PROFILE_STOP_URL}}
    -var profile_ready_timeout_seconds={{.PROFILE_READY_TIMEOUT_SECONDS}}
    -var fgprof_url={{.FGPROF_URL}}
    -var profile_delay={{.PROFILE_DELAY}}
    -var snapshot_profile_delay={{.SNAPSHOT_PROFILE_DELAY}}
    -var profile_seconds={{.PROFILE_SECONDS}}
    -var profile_timeout_seconds={{.PROFILE_TIMEOUT_SECONDS}}
  MEASURECTL_REMOTE: '{{.MEASURECTL_SSH}} {{.MEASURECTL_ROLES}} {{.MEASURECTL_VARS}}'
  MEASURECTL_COMMON: '{{.MEASURECTL_FLAGS}} {{.MEASURECTL_REMOTE}}'

  # Server-changing commands and benchmark runs share one lock across all worktrees.
  OPERATION_LOCK: sh tools/bench/operation-lock.sh
  PORTAL_BENCH_CONFIG: '{{default "" .CONTEST_PORTAL_BENCH_CONFIG}}'

  DEPLOYCTL_COMMON: >-
    {{.DEPLOYCTL_FLAGS}}
    -ssh-user {{.SSH_USER}}
    -ssh-opts "{{.SSH_MUX}}"
    -run-state-file {{.RUN_STATE_FILE}}
    -role all={{splitList " " .ALL_HOSTS | join ","}}
    -role app={{splitList " " .APP_HOSTS | join ","}}
    -role nginx={{splitList " " .NGINX_HOSTS | join ","}}
    -role mysql={{splitList " " .MYSQL_HOSTS | join ","}}
    -role app_db={{.MYSQL_HOST}}
    -role app_init={{splitList " " .APP_HOSTS | first}}
    -var db_name={{.DB_NAME}}
    -var sql_dir={{.SQL_DIR}}
    -var sql_schema_file={{.SQL_SCHEMA_FILE}}
    -var listen_port={{.LISTEN_PORT}}
    -var initialize_path={{.INITIALIZE_PATH}}
    -var remote_home={{.REMOTE_HOME}}
    -var isucon_user={{.ISUCON_USER}}
    -var service={{.SERVICE}}
    -var app_dir={{.APP_DIR}}
    -var app_hosts={{splitList " " .APP_HOSTS | join ","}}
    -var nginx_hosts={{splitList " " .NGINX_HOSTS | join ","}}
    -var mysql_hosts={{splitList " " .MYSQL_HOSTS | join ","}}

  SCORE: ''
  RUN_ID:
    sh: date +%Y%m%d-%H%M%S
  RUN_DIR: '{{.RESULT_DIR}}/{{.RUN_ID}}'
  LATEST_RUN:
    sh: find runs -mindepth 1 -maxdepth 1 -type d -name '[0-9]*' -print 2>/dev/null | sort | tail -1
  RUN: '{{.LATEST_RUN}}'

tasks:
  worktree-link-raw:
    desc: primary worktreeのrawを共有するディレクトリリンクを作成
    silent: true
    requires: { vars: [PRIMARY_WORKTREE] }
    env:
      RAW_PRIMARY_WORKTREE: '{{.PRIMARY_WORKTREE}}'
      RAW_DIRECTORY: '{{.RAW_DIR}}'
    cmds:
      - |
        set -eu
        primary=$(cd "$RAW_PRIMARY_WORKTREE" && pwd -P)
        current=$(git rev-parse --show-toplevel)
        current=$(cd "$current" && pwd -P)
        primary_git=$(git -C "$primary" rev-parse --path-format=absolute --git-common-dir)
        current_git=$(git rev-parse --path-format=absolute --git-common-dir)
        test "$(cd "$primary_git" && pwd -P)" = "$(cd "$current_git" && pwd -P)" || {
          echo 'primary worktree belongs to another repository' >&2
          exit 1
        }
        mkdir -p "$primary/$RAW_DIRECTORY"
        if [ "$current" = "$primary" ]; then exit 0; fi
        destination="$current/$RAW_DIRECTORY"
        if [ -L "$destination" ]; then
          test "$(cd "$destination" && pwd -P)" = "$(cd "$primary/$RAW_DIRECTORY" && pwd -P)" || {
            echo "raw link points elsewhere: $destination" >&2
            exit 1
          }
          exit 0
        fi
        if [ -e "$destination" ]; then
          rmdir "$destination" || {
            echo "raw is not an empty directory: $destination" >&2
            exit 1
          }
        fi
        ln -s "$primary/$RAW_DIRECTORY" "$destination"

  worktree-save-run-raw:
    desc: worktree削除前にRUNの生ログをprimary worktreeへ保存
    silent: true
    requires: { vars: [PRIMARY_WORKTREE] }
    env:
      RUN_RAW_PRIMARY_WORKTREE: '{{.PRIMARY_WORKTREE}}'
      RUN_RAW_RESULTS_DIRECTORY: '{{.RESULT_DIR}}'
    cmds:
      - |
        set -eu
        primary=$(cd "$RUN_RAW_PRIMARY_WORKTREE" && pwd -P)
        current=$(git rev-parse --show-toplevel)
        current=$(cd "$current" && pwd -P)
        primary_git=$(git -C "$primary" rev-parse --path-format=absolute --git-common-dir)
        current_git=$(git rev-parse --path-format=absolute --git-common-dir)
        test "$(cd "$primary_git" && pwd -P)" = "$(cd "$current_git" && pwd -P)" || {
          echo 'primary worktree belongs to another repository' >&2
          exit 1
        }
        if [ "$current" = "$primary" ]; then exit 0; fi
        for source in "$current/$RUN_RAW_RESULTS_DIRECTORY"/*/raw; do
          [ -d "$source" ] || continue
          run=$(basename "$(dirname "$source")")
          destination="$primary/$RUN_RAW_RESULTS_DIRECTORY/$run/raw"
          mkdir -p "$destination"
          rsync -a --ignore-existing "$source/" "$destination/"
        done

  worktree-close-herdr-tab:
    desc: マージ元worktreeのHerdrタブを記録し、成功後に閉じる
    silent: true
    requires: { vars: [WORKTREE, TARGET_WORKTREE] }
    env:
      HERDR_MERGED_WORKTREE: '{{.WORKTREE}}'
      HERDR_TARGET_WORKTREE: '{{.TARGET_WORKTREE}}'
      HERDR_TAB_ACTION: '{{default "close" .TAB_ACTION}}'
    cmds:
      - |
        python3 - <<'PY'
        import hashlib
        import json
        import os
        from pathlib import Path
        import shutil
        import subprocess

        if os.environ.get("HERDR_ENV") != "1" or not shutil.which("herdr"):
            raise SystemExit(0)
        source = Path(os.environ["HERDR_MERGED_WORKTREE"]).resolve()
        target = Path(os.environ["HERDR_TARGET_WORKTREE"]).resolve()
        if source == target:
            raise SystemExit(0)

        result = subprocess.run(
            ["git", "rev-parse", "--path-format=absolute", "--git-common-dir"],
            check=True, capture_output=True, text=True,
        )
        state_dir = Path(result.stdout.strip()) / "wt" / "herdr-tabs"
        state = state_dir / (hashlib.sha256(os.fsencode(source)).hexdigest() + ".json")
        action = os.environ["HERDR_TAB_ACTION"]

        def herdr(*args):
            result = subprocess.run(
                ["herdr", *args], check=True, capture_output=True,
                text=True, timeout=10,
            )
            return json.loads(result.stdout)["result"]

        if action == "capture":
            tabs = {}
            for pane in herdr("pane", "list")["panes"]:
                cwd = pane.get("foreground_cwd") or pane.get("cwd")
                matches = bool(cwd) and Path(cwd).resolve().is_relative_to(source)
                tabs.setdefault(pane["tab_id"], []).append(matches)
            # Capture IDs before Worktrunk moves the directory into its trash.
            tab_ids = [tab_id for tab_id, matches in tabs.items() if all(matches)]
            state_dir.mkdir(parents=True, exist_ok=True)
            state.write_text(json.dumps(tab_ids))
        elif action == "close":
            if not state.exists():
                raise SystemExit(0)
            tab_ids = json.loads(state.read_text())
            # Keep cleanup alive when closing the invoking pane's tab.
            os.setsid()
            if tab_ids:
                live_tabs = {tab["tab_id"] for tab in herdr("tab", "list")["tabs"]}
                for tab_id in tab_ids:
                    if tab_id in live_tabs:
                        herdr("tab", "close", tab_id)
            state.unlink()
        else:
            raise SystemExit("unknown Herdr tab action: " + action)
        PY

  default:
    desc: 現在の役割とタスク一覧を表示
    silent: true
    cmds:
      - |
        echo "現在の役割:"
        echo "  APP   : {{.APP_HOSTS}} (traffic={{.APP_TRAFFIC_HOSTS}})"
        echo "  NGINX : {{.NGINX_HOSTS}} (entry={{.ENTRY_HOST}} {{.ENTRY_IP}})"
        echo "  MYSQL : {{.MYSQL_HOSTS}} (metrics={{.MYSQL_HOST}} {{.MYSQL_IP}})"
        echo "  最新RUN: {{if .RUN}}{{.RUN}}{{else}}なし{{end}}"
        echo
      - task --list

  setup:
    desc: サーバーのソースと設定をローカルへ取得
    cmds:
      - task: setup-webapp
      - task: setup-nginx
      - task: setup-mysql
      - task: setup-systemd
      - task: setup-sysctl
      - task: setup-contest-assets
      - echo "取得完了。ベースラインを git commit してください"

  setup-webapp:
    desc: 除外ファイルの指定に従ってwebappを取得
    preconditions:
      - sh: test -f '{{.SETUP_WEBAPP_EXCLUDES}}'
        msg: SETUP_WEBAPP_EXCLUDES must name an existing rsync exclude file
    cmds:
      - mkdir -p webapp
      - '{{.RSYNC}} --exclude-from="{{.SETUP_WEBAPP_EXCLUDES}}" {{.SSH_USER}}@{{.CONF_SRC}}:{{.REMOTE_HOME}}/webapp/ webapp/'

  setup-nginx:
    desc: /etc/nginx を取得
    cmds:
      - '{{.RSYNC}} --exclude=tls/ {{.SSH_USER}}@{{.CONF_SRC}}:/etc/nginx/ nginx/'

  setup-mysql:
    desc: /etc/mysql を取得
    cmds:
      - '{{.RSYNC}} --exclude=debian.cnf {{.SSH_USER}}@{{.MYSQL_HOST}}:/etc/mysql/ mysql/'

  setup-systemd:
    desc: アプリとMySQLのsystemd設定を取得
    cmds:
      - mkdir -p etc/systemd/system/mysql.service.d etc/vendor-units
      - '{{.RSYNC}} {{.SSH_USER}}@{{.CONF_SRC}}:/lib/systemd/system/nginx.service etc/vendor-units/'
      - '{{.RSYNC}} {{.SSH_USER}}@{{.MYSQL_HOST}}:/lib/systemd/system/mysql.service etc/vendor-units/'
      - '{{.RSYNC}} {{.SSH_USER}}@{{.CONF_SRC}}:/etc/systemd/system/{{.SERVICE}}.service etc/systemd/system/'
      - |
        if {{.SSH}} {{.SSH_USER}}@{{.MYSQL_HOST}} "sudo test -f /etc/systemd/system/mysql.service.d/limits.conf"; then
          {{.RSYNC}} {{.SSH_USER}}@{{.MYSQL_HOST}}:/etc/systemd/system/mysql.service.d/limits.conf etc/systemd/system/mysql.service.d/
        elif [ ! -e etc/systemd/system/mysql.service.d/limits.conf ]; then
          : > etc/systemd/system/mysql.service.d/limits.conf
          echo "remote MySQL limits drop-in is absent; created an empty local baseline"
        else
          echo "remote MySQL limits drop-in is absent; preserved the existing local file"
        fi

  setup-sysctl:
    desc: /etc/sysctl.conf を取得
    cmds:
      - mkdir -p etc
      - '{{.RSYNC}} {{.SSH_USER}}@{{.CONF_SRC}}:/etc/sysctl.conf etc/'

  build:
    desc: GoアプリをローカルでTARGET_OS/TARGET_ARCHへクロスコンパイル
    dir: '{{.APP_DIR}}'
    cmds:
      - '{{.GO_BUILD_ENV}} go build -pgo "{{default "auto" .PGO_PROFILE}}" -trimpath -ldflags "-s -w" -o {{.APP_NAME}} .'
      - task: build-contest-assets

  build-pgo:
    desc: 指定profileまたはdefault.pgoを使ってGoアプリをビルド
    dir: '{{.APP_DIR}}'
    cmds:
      - '{{.GO_BUILD_ENV}} go build -pgo "{{default "auto" .PGO_PROFILE}}" -trimpath -ldflags "-s -w" -o {{.APP_NAME}} .'
      - task: build-contest-assets

  build-proc-metrics:
    internal: true
    silent: true
    dir: '{{.PROC_METRICS_DIR}}'
    sources: ['*.go', ../../go.mod, ../../go.sum]
    generates: [proc-metrics]
    cmds: ['{{.GO_BUILD_ENV}} go build -trimpath -ldflags "-s -w" -o proc-metrics .']

  build-mysql-metrics:
    internal: true
    silent: true
    dir: '{{.MYSQL_METRICS_DIR}}'
    sources: ['*.go', ../../go.mod, ../../go.sum]
    generates: [mysql-metrics]
    cmds: ['{{.GO_BUILD_ENV}} go build -trimpath -ldflags "-s -w" -o mysql-metrics .']

  build-nginx-oncpu-profiler:
    desc: optional nginx on-CPU profilerをTARGET_OS/TARGET_ARCHへビルド
    silent: true
    dir: '{{.NGINX_ONCPU_PROFILER_DIR}}'
    sources: ['*.go', ../../go.mod, ../../go.sum]
    generates: [nginx-oncpu-profiler]
    cmds: ['{{.GO_BUILD_ENV}} go build -trimpath -ldflags "-s -w" -o nginx-oncpu-profiler .']

  build-json-metrics-collector:
    desc: optional JSON snapshot metrics collectorをTARGET_OS/TARGET_ARCHへビルド
    dir: '{{.JSON_METRICS_COLLECTOR_DIR}}'
    sources: ['*.go', ../../go.mod, ../../go.sum]
    generates: [json-metrics-collector]
    cmds: ['{{.GO_BUILD_ENV}} go build -trimpath -ldflags "-s -w" -o json-metrics-collector .']

  build-sql-pool-metrics:
    internal: true
    silent: true
    dir: '{{.SQL_POOL_METRICS_DIR}}'
    sources: ['*.go', ../../go.mod, ../../go.sum]
    generates: [sql-pool-metrics]
    cmds: ['{{.GO_BUILD_ENV}} go build -trimpath -ldflags "-s -w" -o sql-pool-metrics .']

  build-nginx-backend-report:
    internal: true
    silent: true
    dir: '{{.NGINX_BACKEND_REPORT_DIR}}'
    sources: ['*.go', go.mod]
    generates: [nginx-backend-report]
    cmds: ['go build -trimpath -ldflags "-s -w" -o nginx-backend-report .']

  build-user-transition-metrics:
    desc: Cookie由来のユーザー遷移集計ツールをローカルでビルド
    silent: true
    dir: '{{.USER_TRANSITION_METRICS_DIR}}'
    sources: ['*.go', go.mod]
    generates: [user-transition-metrics]
    cmds: ['go build -trimpath -ldflags "-s -w" -o user-transition-metrics .']

  build-measurectl:
    internal: true
    silent: true
    dir: '{{.MEASURECTL_DIR}}'
    sources: ['*.go', go.mod, go.sum, collectors.yaml, digesters.yaml]
    generates: [measurectl]
    cmds: ['go build -trimpath -ldflags "-s -w" -o measurectl .']

  build-bench-output:
    desc: ベンチ結果の出力変換ツールをローカル向けにビルド
    silent: true
    dir: tools/bench-output
    sources: ['*.go', go.mod]
    generates: [bench-output]
    cmds: ['go build -trimpath -ldflags "-s -w" -o bench-output .']

  build-portal-bench:
    desc: 汎用ポータルベンチツールをローカル向けにビルド
    silent: true
    dir: tools/portal-bench
    sources: ['*.go', go.mod]
    generates: [portal-bench]
    cmds: ['go build -trimpath -ldflags "-s -w" -o portal-bench .']

  build-deployctl:
    internal: true
    silent: true
    dir: '{{.DEPLOYCTL_DIR}}'
    sources: ['*.go', go.mod, go.sum, deployments.yaml]
    generates: [deployctl]
    cmds: ['go build -trimpath -ldflags "-s -w" -o deployctl .']

  build-analysisctl:
    internal: true
    silent: true
    dir: '{{.ANALYSISCTL_DIR}}'
    sources: ['*.go', internal/pprofimport/*.go, go.mod, go.sum, ../analysis/sources.yaml, ../analysis/schema/*.sql, ../contest/analysis-schema/*.sql]
    generates: [analysisctl]
    cmds: ['go build -trimpath -ldflags "-s -w" -o analysisctl .']

  build-measurement:
    desc: 共通moduleの全計測collectorをTARGET_OS/TARGET_ARCHへビルド
    deps: [build-proc-metrics, build-mysql-metrics, build-sql-pool-metrics, build-json-metrics-collector, build-nginx-oncpu-profiler]

  test-measurement:
    desc: 共通計測moduleのprofile・endpoint・collectorをローカルで検証
    dir: '{{.MEASUREMENT_DIR}}'
    cmds: [go test -race ./...]

  test-go-profiles:
    desc: 共通moduleのGo profileのRUN別停止・正常出力・採取上限を検証
    dir: '{{.MEASUREMENT_DIR}}'
    cmds: [go test -race -run '^TestProfile' ./app]

  test-measurectl:
    desc: 計測制御ツールをローカルで検証
    dir: '{{.MEASURECTL_DIR}}'
    cmds: [go test -race ./...]

  test-tools:
    desc: 全Goツールのテストを実行
    cmds:
      - for: { var: TOOL_MODULES }
        cmd: cd {{.ITEM}} && go test ./...
    vars:
      TOOL_MODULES:
        sh: find tools -name go.mod -not -path '{{default "" .TOOL_MODULE_EXCLUDE}}' -exec dirname {} \; | sort

  template-diff:
    desc: templateへ反映すべき差分をtools/template/paths.txtの範囲で表示する（DETAIL=1で差分本文）
    silent: true
    cmds:
      - DETAIL='{{.DETAIL}}' bash tools/template/diff.sh '{{.TEMPLATE_DIR | default "../isucon-template"}}'

  inspect-hosts:
    desc: 全ホストの構成を読み取り専用SSHで表示
    cmds:
      - for: { var: ALL_HOSTS }
        cmd: |
          echo "[{{.ITEM}}]"
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -u
            hostname
            uname -srmo
            command -v nproc >/dev/null 2>&1 && nproc || true
            command -v free >/dev/null 2>&1 && free -h || true
            command -v ip >/dev/null 2>&1 && ip -brief address || true
            systemctl is-active {{.SERVICE}} nginx mysql 2>/dev/null || true
            systemctl cat {{.SERVICE}} nginx mysql 2>/dev/null || true
            systemctl list-units --type=service --state=running --no-pager
            systemctl list-unit-files --type=service --state=enabled --no-pager
            sudo ss -lntup
            ps -eo pid,user,comm
          '

  setup-preflight:
    desc: DB再作成前の高速なローカル資材・role・reset plan確認
    deps: [build-deployctl]
    env:
      ISUCON_ALL_HOSTS: '{{.ALL_HOSTS}}'
      ISUCON_APP_HOSTS: '{{.APP_HOSTS}}'
      ISUCON_APP_TRAFFIC_HOSTS: '{{.APP_TRAFFIC_HOSTS}}'
      ISUCON_NGINX_HOSTS: '{{.NGINX_HOSTS}}'
      ISUCON_MYSQL_HOST: '{{.MYSQL_HOST}}'
      ISUCON_MYSQL_HOSTS: '{{.MYSQL_HOSTS}}'
      ISUCON_HOST_IPS: '{{.ALL_HOST_IPS}}'
      ISUCON_APP_DIR: '{{.APP_DIR}}'
      ISUCON_SERVICE: '{{.SERVICE}}'
      ISUCON_RESET_INPUTS: '{{.RESET_INPUTS}}'
      ISUCON_SQL_DIR: '{{.SQL_DIR}}'
      ISUCON_SQL_SCHEMA_FILE: '{{.SQL_SCHEMA_FILE}}'
    cmds:
      # Contest hook may generate local DB inputs; it must not change remote state.
      - task: prepare-db-assets
      - task: gen
      - |
        set -u
        failures=0
        fail() { echo "setup-preflight: $*" >&2; failures=$((failures + 1)); }
        contains_host() { case " $1 " in *" $2 "*) return 0;; *) return 1;; esac; }

        for tool in task go ssh rsync; do
          command -v "$tool" >/dev/null 2>&1 || fail "required local tool is missing: $tool"
        done
        if ! find docs/official -type f ! -name README.md -print -quit 2>/dev/null | grep -q .; then
          fail "docs/official has no contest manual or application specification"
        fi

        [ -n "$ISUCON_ALL_HOSTS" ] || fail "ALL_HOSTS is empty"
        [ -n "$ISUCON_APP_HOSTS" ] || fail "APP_HOSTS is empty"
        [ -n "$ISUCON_APP_TRAFFIC_HOSTS" ] || fail "APP_TRAFFIC_HOSTS is empty"
        [ -n "$ISUCON_NGINX_HOSTS" ] || fail "NGINX_HOSTS is empty"
        if [ -n "$ISUCON_MYSQL_HOSTS" ]; then
          [ -n "$ISUCON_MYSQL_HOST" ] || fail "MYSQL_HOST is empty while MYSQL_HOSTS is assigned"
        fi
        for host in $ISUCON_APP_HOSTS $ISUCON_APP_TRAFFIC_HOSTS $ISUCON_NGINX_HOSTS $ISUCON_MYSQL_HOSTS $ISUCON_MYSQL_HOST; do
          contains_host "$ISUCON_ALL_HOSTS" "$host" || fail "role host is not in ALL_HOSTS: $host"
        done
        if [ -n "$ISUCON_MYSQL_HOSTS" ]; then
          contains_host "$ISUCON_MYSQL_HOSTS" "$ISUCON_MYSQL_HOST" || fail "MYSQL_HOST must belong to MYSQL_HOSTS"
        fi
        for host in $ISUCON_ALL_HOSTS; do
          case " $ISUCON_HOST_IPS " in *" $host="*) ;; *) fail "IP is not configured for $host";; esac
        done
        for pair in $ISUCON_HOST_IPS; do
          host=${pair%%=*}
          ip=${pair#*=}
          [ -n "$ip" ] || fail "IP is empty for $host"
          case "$ip" in 192.0.2.*|198.51.100.*|203.0.113.*) fail "documentation-only IP remains for $host: $ip";; esac
        done

        [ -d "$ISUCON_APP_DIR" ] || fail "application directory is missing: $ISUCON_APP_DIR"
        [ -d nginx ] || fail "nginx configuration has not been acquired"
        if [ -n "$ISUCON_MYSQL_HOSTS" ]; then [ -d mysql ] || fail "MySQL configuration has not been acquired"; fi
        [ -f "etc/systemd/system/$ISUCON_SERVICE.service" ] || fail "application systemd unit is missing"
        [ -f etc/sysctl.conf ] || fail "sysctl configuration is missing"
        [ -f "$ISUCON_SQL_DIR/$ISUCON_SQL_SCHEMA_FILE" ] || fail "database schema file is missing: $ISUCON_SQL_DIR/$ISUCON_SQL_SCHEMA_FILE"

        if [ "$ISUCON_RESET_INPUTS" = none ]; then
          : # Explicitly confirmed: the primary schema is the only local reset input.
        elif [ -n "$ISUCON_RESET_INPUTS" ]; then
          for reset_input in $ISUCON_RESET_INPUTS; do
            [ -f "$reset_input" ] || fail "declared reset input is missing or is not a file: $reset_input"
          done
        else
          fail "list every additional local file read during schema creation or initialization in RESET_INPUTS, or set it to 'none' after checking"
        fi

        [ "$failures" -eq 0 ] || exit 1
      - task: db-recreate-dry

  setup-check:
    desc: preflight後に設定構文・setup対象tool・成果物を確認
    deps: [setup-preflight]
    env:
      ISUCON_CONFIG_CHECK_COMMAND: '{{.CONFIG_CHECK_COMMAND}}'
      ISUCON_SECRET_ALLOWLIST: '{{.SETUP_SECRET_ALLOWLIST}}'
    cmds:
      - |
        set -u
        failures=0
        fail() { echo "setup-check: $*" >&2; failures=$((failures + 1)); }
        contains_host() { case " $1 " in *" $2 "*) return 0;; *) return 1;; esac; }

        for tool in alp pt-query-digest zstd zstdcat duckdb; do
          command -v "$tool" >/dev/null 2>&1 || fail "required local tool is missing: $tool"
        done
        command -v slp >/dev/null 2>&1 || echo "setup-check: optional digester is unavailable: slp" >&2

        secret_candidates=''
        for root in webapp nginx mysql etc; do
          [ -e "$root" ] || continue
          found=$(find "$root" -type f \( -name .env -o -name '*.key' -o -name '*private*.pem' -o -name debian.cnf \) -print 2>/dev/null || true)
          for candidate in $found; do
            if contains_host "$ISUCON_SECRET_ALLOWLIST" "$candidate"; then
              echo "setup-check: explicitly allowed credential-like file: $candidate" >&2
            else
              secret_candidates=$(printf '%s\n%s\n' "$secret_candidates" "$candidate")
            fi
          done
        done
        [ -z "$secret_candidates" ] || fail "credential-like files require an explicit keep/redact decision before commit:\n$secret_candidates"

        [ -n "$ISUCON_CONFIG_CHECK_COMMAND" ] || fail "CONFIG_CHECK_COMMAND is empty; configure local nginx/MySQL/application syntax checks"
        [ "$failures" -eq 0 ] || exit 1
      - sh -c "$ISUCON_CONFIG_CHECK_COMMAND"
      - task: build
      - task: test-tools
        vars:
          TOOL_MODULE_EXCLUDE: tools/dashboard/*
      - task: artifacts
      - task: deploy-app-dry
      - task: deploy-all-dry

  setup-postflight:
    desc: Check roles, internal connectivity, deployed files and collector cleanup
    deps: [build-deployctl, build-measurectl]
    cmds:
      - task: check-roles
      - task: check-network
      - '{{.DEPLOYCTL_DIR}}/deployctl verify -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'
      - '{{.MEASURECTL_DIR}}/measurectl collect check-clean -config {{.MEASURECTL_COLLECTORS_CONFIG}} {{.MEASURECTL_REMOTE}}'

  gen:
    desc: 役割定義からnginx upstreamを生成
    silent: true
    cmds:
      - mkdir -p nginx/conf.d
      - |
        {
          echo "# GENERATED by 'task gen' — do not edit"
          echo "upstream app {"
          {{range (splitList " " .APP_TRAFFIC_HOSTS)}}
          echo "  server {{index $.IP .}}:{{$.LISTEN_PORT}};"
          {{end}}
          # Values follow docs/special-sources/nginx.md (upstream keepalive).
          echo "  keepalive 1024;"
          echo "  keepalive_requests 100000;"
          echo "}"
        } > nginx/conf.d/upstream.conf
      # Contest hook; appends solution-specific upstreams and generated per-host files.
      # A contest that routes everything through this upstream defines it as a no-op.
      - task: gen-contest-routing

  deploy:
    desc: GoアプリをビルドしてAPP_HOSTSへ配布・再起動
    preconditions: &no_active_run
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists; run task after-bench or task abort-run
    cmds:
      - task: build
      - task: deploy-app

  deploy-all:
    desc: sysctl・MySQL・アプリ・nginxを初期化なしで反映
    preconditions: *no_active_run
    cmds:
      # Contest hook; a contest without prepared assets defines it as a no-op.
      - task: prepare-db-assets
      - task: gen
      - task: build
      - task: deploy-plan
        vars: { PLAN: deploy-all }

  db-recreate:
    desc: 競技DBをschemaから再作成してアプリを初期化
    preconditions: *no_active_run
    deps: [setup-preflight]
    cmds:
      - task: deploy-plan
        vars: { PLAN: db-recreate }

  deploy-app-dry:
    desc: app deployの転送先・role・activationを実行せず表示
    deps: [gen, build-deployctl]
    cmds:
      # Contest hook; keep the dry-run input complete in clean worktrees.
      - task: prepare-db-assets
      - '{{.DEPLOYCTL_DIR}}/deployctl apply app -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-all-dry:
    desc: deploy-allの転送先・role・activation graphを実行せず表示
    deps: [build-deployctl]
    cmds:
      # Contest hook; keep the dry-run input complete in clean worktrees.
      - task: prepare-db-assets
      - task: gen
      - task: build
      - '{{.DEPLOYCTL_DIR}}/deployctl apply-plan deploy-all -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-app:
    desc: アプリをAPP_HOSTSへ配布・再起動
    preconditions: *no_active_run
    deps: [gen, build, build-deployctl]
    cmds:
      # Contest hook; the app initialize script consumes these generated files.
      - task: prepare-db-assets
      - '{{.OPERATION_LOCK}} {{.DEPLOYCTL_DIR}}/deployctl apply app -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-nginx:
    desc: nginx設定をNGINX_HOSTSへ配布・reload
    preconditions: *no_active_run
    deps: [build-deployctl]
    cmds:
      - task: gen
      - '{{.OPERATION_LOCK}} {{.DEPLOYCTL_DIR}}/deployctl apply nginx -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-mysql:
    desc: MySQL設定をMYSQL_HOSTSへ配布・restart
    preconditions: *no_active_run
    deps: [build-deployctl]
    cmds:
      - '{{.OPERATION_LOCK}} {{.DEPLOYCTL_DIR}}/deployctl apply mysql -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-sysctl:
    desc: sysctl設定を全ホストへ配布・反映
    preconditions: *no_active_run
    deps: [build-deployctl]
    cmds:
      - '{{.OPERATION_LOCK}} {{.DEPLOYCTL_DIR}}/deployctl apply sysctl -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-plan:
    internal: true
    deps: [build-deployctl]
    requires: { vars: [PLAN] }
    cmds:
      - '{{.OPERATION_LOCK}} {{.DEPLOYCTL_DIR}}/deployctl apply-plan {{.PLAN}} -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  apply-roles:
    desc: 役割外サービスを停止し、役割内サービスを起動
    preconditions: *no_active_run
    deps: [gen, build-deployctl]
    cmds:
      - '{{.OPERATION_LOCK}} {{.DEPLOYCTL_DIR}}/deployctl apply-plan roles -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-nginx-oncpu-prereqs:
    desc: optional profiler用perf packageをNGINX_ONCPU_HOSTへ一時導入
    preconditions: *no_active_run
    cmds:
      - '{{.OPERATION_LOCK}} {{.SSH}} {{.SSH_USER}}@{{.NGINX_ONCPU_HOST}} "bash -s -- install {{.NGINX_ONCPU_HOST}}" < tools/bench/nginx-oncpu-prereqs.sh'

  deploy-nginx-oncpu-prereqs-check:
    desc: optional profilerをNGINX_ONCPU_HOSTでpreflight
    preconditions: *no_active_run
    deps: [build-nginx-oncpu-profiler]
    cmds:
      - '{{.RSYNC}} {{.NGINX_ONCPU_PROFILER_DIR}}/nginx-oncpu-profiler {{.SSH_USER}}@{{.NGINX_ONCPU_HOST}}:/tmp/isucon-nginx-oncpu-prereqs/profiler'
      - '{{.SSH}} {{.SSH_USER}}@{{.NGINX_ONCPU_HOST}} "bash -s -- check {{.NGINX_ONCPU_HOST}} {{.NGINX_ONCPU_PROBE_URL}}" < tools/bench/nginx-oncpu-prereqs.sh'

  deploy-nginx-oncpu-prereqs-cleanup:
    desc: optional profiler用に追加したperf packageだけを撤去
    preconditions: *no_active_run
    cmds:
      - '{{.OPERATION_LOCK}} {{.SSH}} {{.SSH_USER}}@{{.NGINX_ONCPU_HOST}} "bash -s -- cleanup {{.NGINX_ONCPU_HOST}}" < tools/bench/nginx-oncpu-prereqs.sh'

  check-network:
    desc: nginx→appとapp→MySQLのTCP疎通を確認
    silent: true
    cmds:
      - for: { var: NGINX_HOSTS }
        cmd: '{{.SSH}} {{.SSH_USER}}@{{.ITEM}} "for ip in {{.APP_IPS}}; do timeout 2 bash -c \"</dev/tcp/\$ip/{{.LISTEN_PORT}}\"; done" && echo "[{{.ITEM}}] app OK"'
      - for: { var: APP_HOSTS }
        cmd: '{{if .MYSQL_HOSTS}}{{.SSH}} {{.SSH_USER}}@{{.ITEM}} "timeout 2 bash -c \"</dev/tcp/{{if has .ITEM (splitList " " .MYSQL_HOSTS)}}127.0.0.1{{else}}{{.MYSQL_IP}}{{end}}/3306\"" && echo "[{{.ITEM}}] mysql OK"{{else}}true{{end}}'
      - task: check-contest-network

  check-roles:
    desc: service状態がTaskfileの役割定義と一致することを確認
    deps: [build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl check-roles {{.DEPLOYCTL_COMMON}}'

  bench:
    desc: 計測開始→設定したポータルでベンチ→ログと成果物を回収
    silent: true
    deps: [build-portal-bench]
    env:
      ISUCON_BENCH_RUN_STATE_FILE: '{{.RUN_STATE_FILE}}'
      ISUCON_BENCH_RESULTS_DIR: '{{.RESULT_DIR}}'
      ISUCON_BENCH_COLLECT_FLAGS: '{{default "" .MEASURECTL_COLLECT_FLAGS}}'
      ISUCON_BENCH_PROFILES_ENABLED: '{{.PROFILES_ENABLED}}'
    cmds:
      - 'tools/portal-bench/portal-bench -config "{{.PORTAL_BENCH_CONFIG}}" -check'
      - '{{.OPERATION_LOCK}} sh tools/bench/run.sh -- tools/portal-bench/portal-bench -config "{{.PORTAL_BENCH_CONFIG}}"'

  portal-bench-check:
    desc: ポータル設定と認証変数を通信せず検証
    deps: [build-portal-bench]
    cmds:
      - 'tools/portal-bench/portal-bench -config "{{.PORTAL_BENCH_CONFIG}}" -check'

  before-bench:
    desc: 差分をcommitしてRUNを採番し、ログローテートとcollector起動を行う
    silent: true
    deps: [build-measurectl, build-proc-metrics, build-mysql-metrics, build-sql-pool-metrics, build-nginx-oncpu-profiler, build-deployctl]
    cmds:
      # Measure only what this worktree deployed: other worktrees share the servers.
      - '{{.DEPLOYCTL_DIR}}/deployctl verify -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'
      - '{{.DEPLOYCTL_DIR}}/deployctl check-roles {{.DEPLOYCTL_COMMON}}'
      - |
        {{.OPERATION_LOCK}} bash <<'BASH'
        set -eu
        mkdir -p '{{.RAW_DIR}}'
        {{.MEASURECTL_DIR}}/measurectl run begin -collectors {{.MEASURECTL_COLLECTORS_CONFIG}} -digesters {{.MEASURECTL_DIGESTERS_CONFIG}} -commit-changes -run-id '{{.RUN_ID}}' \
          -profiles-enabled={{.PROFILES_ENABLED}} \
          -results '{{.RESULT_DIR}}' -raw-dir '{{.RAW_DIR}}' -run-state-file '{{.RUN_STATE_FILE}}' \
          -collector-flags '{{.MEASURECTL_FLAGS}} {{default "" .MEASURECTL_COLLECT_FLAGS}}' {{.MEASURECTL_REMOTE}}
        BASH

  after-bench:
    desc: 進行中RUNのcollector・ログ・集計・manifestを回収
    silent: true
    deps: [build-measurectl, build-nginx-backend-report, build-user-transition-metrics, build-bench-output]
    vars:
      FINISH_RUN_ID:
        sh: sh tools/bench/active-run-id.sh '{{.RUN_STATE_FILE}}'
    cmds:
      - |
        {{.OPERATION_LOCK}} bash <<'BASH'
        set -eu
        result_markers=$(tools/bench-output/bench-output -input '{{.RESULT_DIR}}/{{.FINISH_RUN_ID}}/bench.log')
        if [ -n "$result_markers" ]; then
          printf '\n%s\n' "$result_markers" >> '{{.RESULT_DIR}}/{{.FINISH_RUN_ID}}/bench.log'
        fi
        BASH
      - >-
        {{.OPERATION_LOCK}} {{.MEASURECTL_DIR}}/measurectl run finalize -collectors {{.MEASURECTL_COLLECTORS_CONFIG}} -digesters {{.MEASURECTL_DIGESTERS_CONFIG}} -auto-commit -results '{{.RESULT_DIR}}' -raw-dir '{{.RAW_DIR}}'
        -run-state-file '{{.RUN_STATE_FILE}}' -scores '{{.RESULT_DIR}}/scores.tsv' -score '{{.SCORE}}'
        -collector-flags '{{.MEASURECTL_FLAGS}} {{default "" .MEASURECTL_COLLECT_FLAGS}}'
        -digester-flags '{{.MEASURECTL_DIGEST_FLAGS}}' {{.MEASURECTL_REMOTE}}
      - task: q-sync
        silent: true
      - '{{.MEASURECTL_DIR}}/measurectl artifacts -recorded -run-dir {{.RESULT_DIR}}/{{.FINISH_RUN_ID}}'

  profiles-collect:
    desc: 進行中RUNへ標準Go profileとfgprofを収集
    deps: [build-measurectl]
    vars:
      ACTIVE_RUN_ID:
        sh: sh tools/bench/active-run-id.sh '{{.RUN_STATE_FILE}}'
    cmds: ['{{.MEASURECTL_DIR}}/measurectl collect oneshot -config {{.MEASURECTL_COLLECTORS_CONFIG}} -group profiles -run-id {{.ACTIVE_RUN_ID}} -run-dir {{.RESULT_DIR}}/{{.ACTIVE_RUN_ID}} {{.MEASURECTL_REMOTE}}']

  profiles-ready:
    desc: 進行中RUNのCPU・fgprof開始を全APP_HOSTSで確認
    silent: true
    deps: [build-measurectl]
    vars:
      ACTIVE_RUN_ID:
        sh: sh tools/bench/active-run-id.sh '{{.RUN_STATE_FILE}}'
    cmds: ['{{.MEASURECTL_DIR}}/measurectl collect ready -config {{.MEASURECTL_COLLECTORS_CONFIG}} -group profiles -run-id {{.ACTIVE_RUN_ID}} {{.MEASURECTL_REMOTE}}']

  profiles-stop:
    desc: 進行中RUNのCPU・fgprofへ停止を通知し、採取中のHTTP応答で書き出す
    deps: [build-measurectl]
    vars:
      ACTIVE_RUN_ID:
        sh: sh tools/bench/active-run-id.sh '{{.RUN_STATE_FILE}}'
    cmds: ['{{.MEASURECTL_DIR}}/measurectl collect oneshot-stop -config {{.MEASURECTL_COLLECTORS_CONFIG}} -group profiles -run-id {{.ACTIVE_RUN_ID}} {{.MEASURECTL_REMOTE}}']

  fgprof-collect:
    desc: 進行中RUNへfgprofを収集
    deps: [build-measurectl]
    vars:
      ACTIVE_RUN_ID:
        sh: sh tools/bench/active-run-id.sh '{{.RUN_STATE_FILE}}'
    cmds: ['{{.MEASURECTL_DIR}}/measurectl collect oneshot -config {{.MEASURECTL_COLLECTORS_CONFIG}} -only fgprof -run-id {{.ACTIVE_RUN_ID}} -run-dir {{.RESULT_DIR}}/{{.ACTIVE_RUN_ID}} {{.MEASURECTL_COMMON}}']

  go-profiles-collect:
    desc: 進行中RUNへGo CPU・heap・allocs・goroutine profileを並列収集
    deps: [build-measurectl]
    vars:
      ACTIVE_RUN_ID:
        sh: sh tools/bench/active-run-id.sh '{{.RUN_STATE_FILE}}'
    cmds: ['{{.MEASURECTL_DIR}}/measurectl collect oneshot -config {{.MEASURECTL_COLLECTORS_CONFIG}} -only go-cpu,go-heap,go-allocs,go-goroutine -run-id {{.ACTIVE_RUN_ID}} -run-dir {{.RESULT_DIR}}/{{.ACTIVE_RUN_ID}} {{.MEASURECTL_COMMON}}']

  go-profile-top:
    desc: 保存済みGo profileをgo tool pprof -topで表示（PROFILE=isucon-1-go-cpu.pprof）
    requires: { vars: [PROFILE] }
    preconditions:
      - sh: test -n '{{.RUN}}' -a -f '{{.RUN}}/{{.PROFILE}}'
        msg: 指定したGo profileがありません
    cmds: ['go tool pprof -top {{.RUN}}/{{.PROFILE}}']

  abort-run:
    desc: 進行中RUNを破棄しcollectorを掃除（破壊的）
    deps: [build-measurectl]
    cmds:
      - |
        {{.OPERATION_LOCK}} bash <<'BASH'
        set -eu
        sh tools/bench/active-run-id.sh '{{.RUN_STATE_FILE}}' >/dev/null
        {{.MEASURECTL_DIR}}/measurectl collect sweep -config {{.MEASURECTL_COLLECTORS_CONFIG}} {{.MEASURECTL_COMMON}}
        mv -f '{{.RUN_STATE_FILE}}' '{{.RAW_DIR}}/aborted-run-id'
        BASH

  artifacts:
    desc: 成果物宣言と読み手の整合を確認
    deps: [build-measurectl]
    cmds:
      - '{{.MEASURECTL_DIR}}/measurectl artifacts -check'

  artifacts-run:
    desc: 指定RUN（既定は最新）の必須成果物が揃っていることを確認
    deps: [build-measurectl]
    preconditions:
      - sh: test -n '{{.RUN}}' -a -d '{{.RUN}}'
        msg: 確認可能なRUNがありません
    cmds:
      - '{{.MEASURECTL_DIR}}/measurectl artifacts -recorded -run-dir {{.RUN}}'

  q:
    desc: 同期済み分析DBへの読み取り専用RUN横断DuckDBクエリ
    env:
      ISUCON_QUERY: '{{join " " .CLI_ARGS_LIST}}'
    cmds:
      - |
        if [ -n "$ISUCON_QUERY" ]; then
          duckdb -readonly '{{.ANALYSIS_DB}}' -c "$ISUCON_QUERY"
        else
          duckdb -readonly '{{.ANALYSIS_DB}}'
        fi

  q-sync:
    desc: finalized RUNを分析DBへ同期
    deps: [build-analysisctl]
    preconditions:
      - sh: find '{{.RESULT_DIR}}' -mindepth 1 -maxdepth 1 -type d -name '[0-9]*' | grep -q .
        msg: finalized RUNがありません。先にベンチ計測を回収してください
    cmds: ['{{.ANALYSISCTL_DIR}}/analysisctl sync -config {{.ANALYSIS_CONFIG}} -db {{.ANALYSIS_DB}} -results {{.RESULT_DIR}}']

  q-build:
    desc: 分析DBを全RUNから再構築
    deps: [build-analysisctl]
    preconditions:
      - sh: find '{{.RESULT_DIR}}' -mindepth 1 -maxdepth 1 -type d -name '[0-9]*' | grep -q .
        msg: finalized RUNがありません。先にベンチ計測を回収してください
    cmds: ['{{.ANALYSISCTL_DIR}}/analysisctl rebuild -config {{.ANALYSIS_CONFIG}} -db {{.ANALYSIS_DB}} -results {{.RESULT_DIR}}']

  topology-screen:
    desc: 保存済みaccess logをシャード候補ごとにオフライン集計
    dir: tools/topology-screen
    cmds: ['go run . -run-dir {{.ROOT_DIR}}/{{.RUN}} {{.CLI_ARGS}}']

  alp:
    desc: 指定RUN（既定は最新）のalp.txtを表示
    preconditions:
      - sh: test -n '{{.RUN}}' -a -f '{{.RUN}}/alp.txt'
        msg: alp.txtがあるRUNがありません
    cmds: ['cat {{.RUN}}/alp.txt']

  dashboard:
    desc: ローカル計測ダッシュボードを起動
    deps: [dashboard-server, dashboard-web]

  dashboard-server:
    internal: true
    dir: tools/dashboard/server
    cmds: ['go run . -root {{.ROOT_DIR}} -analysis-db {{.ROOT_DIR}}/{{.ANALYSIS_DB}} -addr 127.0.0.1:8091']

  dashboard-web:
    internal: true
    dir: tools/dashboard/web
    cmds:
      - test -d node_modules || npm ci
      - DASHBOARD_API_TARGET=http://127.0.0.1:8091 npm run dev -- --host 127.0.0.1 --port 5173 --strictPort

  browser-install:
    desc: dashboard確認用Playwright CLIをローカルへ導入
    dir: '{{.BROWSER_TOOLS_DIR}}'
    cmds:
      - npm ci --cache '{{.ROOT_DIR}}/.task/npm-cache'
      - npx playwright-cli install-browser

  status:
    desc: 全ホストのサービス状態
    cmds:
      - for: { var: ALL_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} \
            "systemctl is-active {{.SERVICE}} nginx mysql | tr '\n' ' '; echo; uptime"

  logs:
    desc: APP_HOSTSのアプリログ
    cmds:
      - for: { var: APP_HOSTS }
        cmd: '{{.SSH}} {{.SSH_USER}}@{{.ITEM}} "sudo journalctl -u {{.SERVICE}} -n 80 --no-pager"'

  ssh:
    desc: 指定ホストへisuconユーザーでログイン（HOST=isucon-1）
    interactive: true
    vars: { HOST: '{{.HOST | default "isucon-1"}}' }
    cmds: ['{{.SSH}} -t {{.SSH_USER}}@{{.HOST}} "sudo -u {{.ISUCON_USER}} -i"']

  db:
    desc: MYSQL_HOSTのMySQLへ接続
    interactive: true
    cmds: ['{{.SSH}} -t {{.SSH_USER}}@{{.MYSQL_HOST}} "sudo mysql {{.DB_NAME}}"']

  clear-cache:
    desc: 古いログとAPTキャッシュを削除（破壊的。明示指示時のみ）
    cmds:
      - for: { var: ALL_HOSTS }
        cmd: '{{.OPERATION_LOCK}} {{.SSH}} {{.SSH_USER}}@{{.ITEM}} "sudo journalctl --vacuum-size=10M && sudo apt-get clean"'

  rotate-mysql-logs:
    desc: 全ホストの既存logrotate設定でMySQLログをローテート・圧縮
    preconditions: *no_active_run
    cmds:
      - for: { var: ALL_HOSTS }
        cmd: |
          {{.OPERATION_LOCK}} {{.SSH}} {{.SSH_USER}}@{{.ITEM}} 'sudo bash -se' <<'REMOTE'
          rotation_config=$(mktemp /tmp/isucon-logrotate.XXXXXX)
          trap 'rm -f "$rotation_config"' EXIT
          printf '%s\n' 'su root adm' 'include /etc/logrotate.d/mysql-server' > "$rotation_config"
          logrotate --force --verbose "$rotation_config"
          REMOTE

  archive-rotated-mysql-log:
    desc: HOSTのローテート済みスローログをローカル回収しSHA-256一致後に原本を削除
    requires:
      vars: [HOST]
    preconditions: *no_active_run
    cmds:
      - |
        {{.OPERATION_LOCK}} bash <<'BASH'
        set -eu
        set -o pipefail
        mkdir -p '{{.RAW_DIR}}'
        archive_path='{{.RAW_DIR}}/{{.HOST}}-mysql-slow-'$(date +%Y%m%d-%H%M%S)'.log.gz'
        test ! -e "$archive_path"
        expected=$({{.SSH}} {{.SSH_USER}}@{{.HOST}} 'sudo sha256sum /var/log/mysql/mysql-slow.log.1' | cut -d ' ' -f 1)
        {{.SSH}} {{.SSH_USER}}@{{.HOST}} 'sudo gzip -1 -c /var/log/mysql/mysql-slow.log.1' > "$archive_path.partial"
        actual=$(gzip -dc "$archive_path.partial" | shasum -a 256 | cut -d ' ' -f 1)
        test "$actual" = "$expected"
        mv "$archive_path.partial" "$archive_path"
        {{.SSH}} {{.SSH_USER}}@{{.HOST}} "echo '$expected  /var/log/mysql/mysql-slow.log.1' | sudo sha256sum -c - && sudo rm /var/log/mysql/mysql-slow.log.1"
        echo "Archived: $archive_path SHA-256: $expected"
        BASH

  db-recreate-dry:
    desc: DB再作成の対象とactivationを実行せず表示
    deps: [gen, build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl apply-plan db-recreate -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'


  deploy-app-unit-dry:
    desc: アプリのsystemd設定のみの転送・反映計画を表示
    deps: [gen, build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl apply app-unit -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'


  deploy-app-unit:
    desc: アプリのsystemd設定のみを反映し停止中なら起動
    preconditions: *no_active_run
    deps: [gen, build-deployctl]
    cmds:
      - '{{.OPERATION_LOCK}} {{.DEPLOYCTL_DIR}}/deployctl apply app-unit -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'


  bench-timestamp:
    desc: 計測対象の入口ホストのUTC時刻を返す（ベンチは実行しない）
    cmds:
      - '{{.SSH}} {{.SSH_USER}}@{{.ENTRY_HOST}} "date -u +%Y-%m-%dT%H:%M:%S.%NZ" </dev/null'


  config-check:
    desc: 設定を正規配布先へ転送し構文検査（reloadなし）
    preconditions: *no_active_run
    deps: [build-deployctl]
    cmds:
      - task: gen
      - '{{.OPERATION_LOCK}} {{.DEPLOYCTL_DIR}}/deployctl apply config-check -config {{.CONFIG_CHECK_CONFIG}} {{.DEPLOYCTL_COMMON}}'
