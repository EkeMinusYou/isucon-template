# ISUCON template — deployment, measurement, and analysis
#
# Update the variables in the first section at the start of each contest.
version: '3'

vars:
  SSH_USER: ubuntu
  ISUCON_USER: isucon
  APP_NAME: app
  APP_DIR: webapp/go
  SERVICE: app
  DB_NAME: app
  REMOTE_HOME: /home/isucon
  LISTEN_PORT: '8080'

  # Confirm these contest-specific gates before running setup-check.
  TARGET_OS: linux
  TARGET_ARCH: amd64
  SCHEMA_PATHS: ''
  SCHEMA_IN_WEBAPP: 'false'
  CONFIG_CHECK_COMMAND: ''
  SETUP_SECRET_ALLOWLIST: ''
  SETUP_WEBAPP_EXCLUDES: tools/setup/webapp-excludes.txt

  SSH_MUX: -o ControlMaster=auto -o ControlPath=/tmp/.isucon-ssh-%C -o ControlPersist=600
  SSH: ssh -o RequestTTY=no -o LogLevel=ERROR {{.SSH_MUX}}
  RSYNC: rsync -az --rsync-path="sudo rsync" -e "ssh -o RequestTTY=no -o LogLevel=ERROR {{.SSH_MUX}}"
  GO_BUILD_ENV: CGO_ENABLED=0 GOOS={{.TARGET_OS}} GOARCH={{.TARGET_ARCH}}

  # Contest topology. Keep host roles and private addresses here only.
  ALL_HOSTS: isucon-1 isucon-2 isucon-3
  BENCH_HOST: isucon-bench
  IP:
    map:
      isucon-1: 192.0.2.11
      isucon-2: 192.0.2.12
      isucon-3: 192.0.2.13
  APP_HOSTS: isucon-1
  APP_TRAFFIC_HOSTS: isucon-1
  NGINX_HOSTS: isucon-1
  # MYSQL_HOST is the detailed measurement source and default DB connection.
  MYSQL_HOST: isucon-1
  # Deployment and service enable/disable targets; preserve the single-host default.
  MYSQL_HOSTS: '{{.MYSQL_HOST}}'
  CONF_SRC: isucon-1

  ENTRY_HOST: '{{splitList " " .NGINX_HOSTS | first}}'
  ENTRY_IP: '{{index .IP (splitList " " .NGINX_HOSTS | first)}}'
  MYSQL_IP: '{{index .IP .MYSQL_HOST}}'
  APP_IPS: '{{$ips := list}}{{range (splitList " " .APP_TRAFFIC_HOSTS)}}{{$ips = append $ips (index $.IP .)}}{{end}}{{join " " $ips}}'
  ALL_HOST_IPS: '{{range (splitList " " .ALL_HOSTS)}}{{.}}={{index $.IP .}} {{end}}'

  BENCH_TARGET: http://{{.ENTRY_IP}}
  BENCH_COMMAND: ./bench_linux_amd64 run --target {{.BENCH_TARGET}}

  RESULT_DIR: runs
  RAW_DIR: raw
  RUN_STATE_FILE: '{{.RAW_DIR}}/current-run-id'
  BACKLOG_DB: tools/backlog/backlog.sqlite3
  ANALYSIS_DB: runs/analysis.duckdb
  ANALYSIS_CONFIG: tools/analysis/sources.yaml
  DEPLOYCTL_CONFIG: tools/deployctl/deployments.yaml

  PROC_METRICS_DIR: tools/proc-metrics
  MYSQL_METRICS_DIR: tools/mysql-metrics
  NGINX_ONCPU_PROFILER_DIR: tools/nginx-oncpu-profiler
  NGINX_ONCPU_HOST: '{{.ENTRY_HOST}}'
  NGINX_ONCPU_PROBE_URL: http://127.0.0.1/
  PPROF_BASE_URL: http://127.0.0.1:6060/debug/pprof
  PROFILE_STATUS_URL: http://127.0.0.1:6060/debug/profiles/status
  # Standard measurement; setup must install the endpoint adapter before a RUN.
  PROFILES_ENABLED: 'true'
  PROFILE_DELAY: 0s
  SNAPSHOT_PROFILE_DELAY: 40s
  # Example budget: initialization + checks + load + margin. Tune for the contest.
  PROFILE_SECONDS: '120'
  FGPROF_URL: 'http://127.0.0.1:6060/debug/fgprof?seconds={{.PROFILE_SECONDS}}'
  PROFILE_TIMEOUT_SECONDS: '{{add (int .PROFILE_SECONDS) 15}}'
  PROFILE_READY_TIMEOUT_SECONDS: '15'
  NGINX_BACKEND_REPORT_DIR: tools/nginx-backend-report
  JSON_METRICS_COLLECTOR_DIR: tools/json-metrics-collector
  USER_TRANSITION_METRICS_DIR: tools/user-transition-metrics
  MEASURECTL_DIR: tools/measurectl
  DEPLOYCTL_DIR: tools/deployctl
  ANALYSISCTL_DIR: tools/analysisctl
  BROWSER_TOOLS_DIR: tools/browser

  MEASURECTL_FLAGS: ''
  MEASURECTL_DIGEST_FLAGS: ''
  COMPARE_RUN: ''
  COMPARE_ALLOWED_CARDS: ''
  COMPARE_ALLOWED_ROLES: ''
  MEASURECTL_SSH: '-ssh-user {{.SSH_USER}} -ssh-opts "{{.SSH_MUX}}"'
  MEASURECTL_ROLES: >-
    -role all={{splitList " " .ALL_HOSTS | join ","}}
    -role app={{splitList " " .APP_HOSTS | join ","}}
    -role app_traffic={{splitList " " .APP_TRAFFIC_HOSTS | join ","}}
    -role nginx={{splitList " " .NGINX_HOSTS | join ","}}
    -role entry={{.ENTRY_HOST}}
    -role nginx_profile={{.ENTRY_HOST}}
    -role mysql={{.MYSQL_HOST}}
    -role mysql_all={{splitList " " .MYSQL_HOSTS | join ","}}
  MEASURECTL_VARS: >-
    -var services={{.SERVICE}},nginx,mysql
    -var app_service={{.SERVICE}}
    -var pprof_base_url={{.PPROF_BASE_URL}}
    -var profile_status_url={{.PROFILE_STATUS_URL}}
    -var profile_ready_timeout_seconds={{.PROFILE_READY_TIMEOUT_SECONDS}}
    -var fgprof_url={{.FGPROF_URL}}
    -var profile_delay={{.PROFILE_DELAY}}
    -var snapshot_profile_delay={{.SNAPSHOT_PROFILE_DELAY}}
    -var profile_seconds={{.PROFILE_SECONDS}}
    -var profile_timeout_seconds={{.PROFILE_TIMEOUT_SECONDS}}
  MEASURECTL_REMOTE: '{{.MEASURECTL_SSH}} {{.MEASURECTL_ROLES}} {{.MEASURECTL_VARS}}'
  MEASURECTL_COMMON: '{{.MEASURECTL_FLAGS}} {{.MEASURECTL_REMOTE}}'

  DEPLOYCTL_FLAGS: ''
  DEPLOYCTL_COMMON: >-
    {{.DEPLOYCTL_FLAGS}}
    -ssh-user {{.SSH_USER}}
    -ssh-opts "{{.SSH_MUX}}"
    -run-state-file {{.RUN_STATE_FILE}}
    -role all={{splitList " " .ALL_HOSTS | join ","}}
    -role app={{splitList " " .APP_HOSTS | join ","}}
    -role nginx={{splitList " " .NGINX_HOSTS | join ","}}
    -role mysql={{splitList " " .MYSQL_HOSTS | join ","}}
    -var remote_home={{.REMOTE_HOME}}
    -var isucon_user={{.ISUCON_USER}}
    -var service={{.SERVICE}}
    -var app_dir={{.APP_DIR}}
    -var app_hosts={{splitList " " .APP_HOSTS | join ","}}
    -var nginx_hosts={{splitList " " .NGINX_HOSTS | join ","}}
    -var mysql_hosts={{splitList " " .MYSQL_HOSTS | join ","}}

  SCORE: ''
  RUN_ID:
    sh: date +%Y%m%d-%H%M%S
  RUN_DIR: '{{.RESULT_DIR}}/{{.RUN_ID}}'
  LATEST_RUN:
    sh: find runs -mindepth 1 -maxdepth 1 -type d -name '[0-9]*' -print 2>/dev/null | sort | tail -1
  RUN: '{{.LATEST_RUN}}'

tasks:
  default:
    desc: 現在の役割とタスク一覧を表示
    silent: true
    cmds:
      - |
        echo "現在の役割:"
        echo "  APP   : {{.APP_HOSTS}} (traffic={{.APP_TRAFFIC_HOSTS}})"
        echo "  NGINX : {{.NGINX_HOSTS}} (entry={{.ENTRY_HOST}} {{.ENTRY_IP}})"
        echo "  MYSQL : {{.MYSQL_HOSTS}} (metrics={{.MYSQL_HOST}} {{.MYSQL_IP}})"
        echo "  最新RUN: {{if .RUN}}{{.RUN}}{{else}}なし{{end}}"
        echo
      - task --list

  setup:
    desc: サーバーのソースと設定をローカルへ取得
    cmds:
      - task: setup-webapp
      - task: setup-nginx
      - task: setup-mysql
      - task: setup-systemd
      - task: setup-sysctl
      - echo "取得完了。ベースラインを git commit してください"

  setup-webapp:
    desc: 除外ファイルの指定に従ってwebappを取得
    preconditions:
      - sh: test -f '{{.SETUP_WEBAPP_EXCLUDES}}'
        msg: SETUP_WEBAPP_EXCLUDES must name an existing rsync exclude file
    cmds:
      - mkdir -p webapp
      - '{{.RSYNC}} --exclude-from="{{.SETUP_WEBAPP_EXCLUDES}}" {{.SSH_USER}}@{{.CONF_SRC}}:{{.REMOTE_HOME}}/webapp/ webapp/'

  setup-nginx:
    desc: /etc/nginx を取得
    cmds:
      - '{{.RSYNC}} {{.SSH_USER}}@{{.CONF_SRC}}:/etc/nginx/ nginx/'

  setup-mysql:
    desc: /etc/mysql を取得
    cmds:
      - '{{.RSYNC}} {{.SSH_USER}}@{{.MYSQL_HOST}}:/etc/mysql/ mysql/'

  setup-systemd:
    desc: アプリとMySQLのsystemd設定を取得
    cmds:
      - mkdir -p etc/systemd/system/mysql.service.d
      - '{{.RSYNC}} {{.SSH_USER}}@{{.CONF_SRC}}:/etc/systemd/system/{{.SERVICE}}.service etc/systemd/system/'
      - |
        if {{.SSH}} {{.SSH_USER}}@{{.MYSQL_HOST}} "sudo test -f /etc/systemd/system/mysql.service.d/limits.conf"; then
          {{.RSYNC}} {{.SSH_USER}}@{{.MYSQL_HOST}}:/etc/systemd/system/mysql.service.d/limits.conf etc/systemd/system/mysql.service.d/
        elif [ ! -e etc/systemd/system/mysql.service.d/limits.conf ]; then
          : > etc/systemd/system/mysql.service.d/limits.conf
          echo "remote MySQL limits drop-in is absent; created an empty local baseline"
        else
          echo "remote MySQL limits drop-in is absent; preserved the existing local file"
        fi

  setup-sysctl:
    desc: /etc/sysctl.conf を取得
    cmds:
      - mkdir -p etc
      - '{{.RSYNC}} {{.SSH_USER}}@{{.CONF_SRC}}:/etc/sysctl.conf etc/'

  build:
    desc: GoアプリをローカルでTARGET_OS/TARGET_ARCHへクロスコンパイル
    dir: '{{.APP_DIR}}'
    cmds:
      - '{{.GO_BUILD_ENV}} go build -trimpath -ldflags "-s -w" -o {{.APP_NAME}} .'

  build-pgo:
    desc: default.pgoを使ってGoアプリをビルド
    dir: '{{.APP_DIR}}'
    cmds:
      - '{{.GO_BUILD_ENV}} go build -pgo=auto -trimpath -ldflags "-s -w" -o {{.APP_NAME}} .'

  build-proc-metrics:
    internal: true
    dir: '{{.PROC_METRICS_DIR}}'
    sources: ['*.go', go.mod]
    generates: [proc-metrics]
    cmds: ['{{.GO_BUILD_ENV}} go build -trimpath -ldflags "-s -w" -o proc-metrics .']

  build-mysql-metrics:
    internal: true
    dir: '{{.MYSQL_METRICS_DIR}}'
    sources: ['*.go', go.mod, go.sum]
    generates: [mysql-metrics]
    cmds: ['{{.GO_BUILD_ENV}} go build -trimpath -ldflags "-s -w" -o mysql-metrics .']

  build-nginx-oncpu-profiler:
    desc: optional nginx on-CPU profilerをTARGET_OS/TARGET_ARCHへビルド
    dir: '{{.NGINX_ONCPU_PROFILER_DIR}}'
    sources: ['*.go', go.mod]
    generates: [nginx-oncpu-profiler]
    cmds: ['{{.GO_BUILD_ENV}} go build -trimpath -ldflags "-s -w" -o nginx-oncpu-profiler .']

  build-json-metrics-collector:
    desc: optional JSON snapshot metrics collectorをTARGET_OS/TARGET_ARCHへビルド
    dir: '{{.JSON_METRICS_COLLECTOR_DIR}}'
    sources: ['*.go', go.mod]
    generates: [json-metrics-collector]
    cmds: ['{{.GO_BUILD_ENV}} go build -trimpath -ldflags "-s -w" -o json-metrics-collector .']

  build-nginx-backend-report:
    internal: true
    dir: '{{.NGINX_BACKEND_REPORT_DIR}}'
    sources: ['*.go', go.mod]
    generates: [nginx-backend-report]
    cmds: ['go build -trimpath -ldflags "-s -w" -o nginx-backend-report .']

  build-user-transition-metrics:
    desc: Cookie由来のユーザー遷移集計ツールをローカルでビルド
    dir: '{{.USER_TRANSITION_METRICS_DIR}}'
    sources: ['*.go', go.mod, routes.json]
    generates: [user-transition-metrics]
    cmds: ['go build -trimpath -ldflags "-s -w" -o user-transition-metrics .']

  build-measurectl:
    internal: true
    dir: '{{.MEASURECTL_DIR}}'
    sources: ['*.go', go.mod, go.sum, collectors.yaml, digesters.yaml]
    generates: [measurectl]
    cmds: ['go build -trimpath -ldflags "-s -w" -o measurectl .']

  build-deployctl:
    internal: true
    dir: '{{.DEPLOYCTL_DIR}}'
    sources: ['*.go', go.mod, go.sum, deployments.yaml]
    generates: [deployctl]
    cmds: ['go build -trimpath -ldflags "-s -w" -o deployctl .']

  build-analysisctl:
    internal: true
    dir: '{{.ANALYSISCTL_DIR}}'
    sources: ['*.go', internal/pprofimport/*.go, go.mod, go.sum, ../analysis/sources.yaml, ../analysis/schema/*.sql]
    generates: [analysisctl]
    cmds: ['go build -trimpath -ldflags "-s -w" -o analysisctl .']

  test-tools:
    desc: 全Goツールのテストを実行
    cmds:
      - for: { var: TOOL_MODULES }
        cmd: cd {{.ITEM}} && go test ./...
    vars:
      TOOL_MODULES:
        sh: find tools -name go.mod -exec dirname {} \; | sort

  inspect-hosts:
    desc: 全ホストの構成を読み取り専用SSHで表示
    cmds:
      - for: { var: ALL_HOSTS }
        cmd: |
          echo "[{{.ITEM}}]"
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -u
            hostname
            uname -srmo
            command -v nproc >/dev/null 2>&1 && nproc || true
            command -v free >/dev/null 2>&1 && free -h || true
            command -v ip >/dev/null 2>&1 && ip -brief address || true
            systemctl is-active {{.SERVICE}} nginx mysql 2>/dev/null || true
            systemctl cat {{.SERVICE}} nginx mysql 2>/dev/null || true
          '

  setup-check:
    desc: 競技固有値・取得物・ローカル検証・deploy dry-runを一括確認
    env:
      ISUCON_ALL_HOSTS: '{{.ALL_HOSTS}}'
      ISUCON_APP_HOSTS: '{{.APP_HOSTS}}'
      ISUCON_APP_TRAFFIC_HOSTS: '{{.APP_TRAFFIC_HOSTS}}'
      ISUCON_NGINX_HOSTS: '{{.NGINX_HOSTS}}'
      ISUCON_MYSQL_HOST: '{{.MYSQL_HOST}}'
      ISUCON_MYSQL_HOSTS: '{{.MYSQL_HOSTS}}'
      ISUCON_HOST_IPS: '{{.ALL_HOST_IPS}}'
      ISUCON_APP_DIR: '{{.APP_DIR}}'
      ISUCON_SERVICE: '{{.SERVICE}}'
      ISUCON_SCHEMA_PATHS: '{{.SCHEMA_PATHS}}'
      ISUCON_SCHEMA_IN_WEBAPP: '{{.SCHEMA_IN_WEBAPP}}'
      ISUCON_CONFIG_CHECK_COMMAND: '{{.CONFIG_CHECK_COMMAND}}'
      ISUCON_SECRET_ALLOWLIST: '{{.SETUP_SECRET_ALLOWLIST}}'
    cmds:
      - |
        set -u
        failures=0
        fail() { echo "setup-check: $*" >&2; failures=$((failures + 1)); }
        contains_host() { case " $1 " in *" $2 "*) return 0;; *) return 1;; esac; }

        for tool in task go ssh rsync alp pt-query-digest zstd zstdcat duckdb; do
          command -v "$tool" >/dev/null 2>&1 || fail "required local tool is missing: $tool"
        done
        command -v slp >/dev/null 2>&1 || echo "setup-check: optional digester is unavailable: slp" >&2

        if ! find docs/official -type f ! -name README.md -print -quit 2>/dev/null | grep -q .; then
          fail "docs/official has no contest manual or application specification"
        fi

        for host in $ISUCON_APP_HOSTS $ISUCON_APP_TRAFFIC_HOSTS $ISUCON_NGINX_HOSTS $ISUCON_MYSQL_HOSTS $ISUCON_MYSQL_HOST; do
          contains_host "$ISUCON_ALL_HOSTS" "$host" || fail "role host is not in ALL_HOSTS: $host"
        done
        [ -n "$ISUCON_MYSQL_HOSTS" ] || fail "MYSQL_HOSTS is empty"
        contains_host "$ISUCON_MYSQL_HOSTS" "$ISUCON_MYSQL_HOST" || fail "MYSQL_HOST must belong to MYSQL_HOSTS"
        for pair in $ISUCON_HOST_IPS; do
          host=${pair%%=*}
          ip=${pair#*=}
          [ -n "$ip" ] || fail "IP is empty for $host"
          case "$ip" in 192.0.2.*|198.51.100.*|203.0.113.*) fail "documentation-only IP remains for $host: $ip";; esac
        done

        [ -d "$ISUCON_APP_DIR" ] || fail "application directory is missing: $ISUCON_APP_DIR"
        [ -d nginx ] || fail "nginx configuration has not been acquired"
        [ -d mysql ] || fail "MySQL configuration has not been acquired"
        [ -f "etc/systemd/system/$ISUCON_SERVICE.service" ] || fail "application systemd unit is missing"
        [ -f etc/sysctl.conf ] || fail "sysctl configuration is missing"

        if [ -n "$ISUCON_SCHEMA_PATHS" ]; then
          for schema_path in $ISUCON_SCHEMA_PATHS; do
            [ -e "$schema_path" ] || fail "declared schema path is missing: $schema_path"
          done
        elif [ "$ISUCON_SCHEMA_IN_WEBAPP" != true ]; then
          fail "set SCHEMA_PATHS, or set SCHEMA_IN_WEBAPP=true after confirming initialization assets are included in webapp"
        fi

        secret_candidates=''
        for root in webapp nginx mysql etc; do
          [ -e "$root" ] || continue
          found=$(find "$root" -type f \( -name .env -o -name '*.key' -o -name '*private*.pem' -o -name debian.cnf \) -print 2>/dev/null || true)
          for candidate in $found; do
            if contains_host "$ISUCON_SECRET_ALLOWLIST" "$candidate"; then
              echo "setup-check: explicitly allowed credential-like file: $candidate" >&2
            else
              secret_candidates=$(printf '%s\n%s\n' "$secret_candidates" "$candidate")
            fi
          done
        done
        [ -z "$secret_candidates" ] || fail "credential-like files require an explicit keep/redact decision before commit:\n$secret_candidates"

        [ -n "$ISUCON_CONFIG_CHECK_COMMAND" ] || fail "CONFIG_CHECK_COMMAND is empty; configure local nginx/MySQL/application syntax checks"
        [ "$failures" -eq 0 ] || exit 1
      - sh -c "$ISUCON_CONFIG_CHECK_COMMAND"
      - task: build
      - task: test-tools
      - task: artifacts
      - task: backlog
        vars: { CLI_ARGS: validate }
      - task: deploy-app-dry
      - task: deploy-all-dry

  gen:
    desc: 役割定義からnginx upstreamを生成
    silent: true
    cmds:
      - mkdir -p nginx/conf.d
      - |
        {
          echo "# GENERATED by 'task gen' — do not edit"
          echo "upstream app {"
          {{range (splitList " " .APP_TRAFFIC_HOSTS)}}
          echo "  server {{index $.IP .}}:{{$.LISTEN_PORT}};"
          {{end}}
          echo "  keepalive 64;"
          echo "}"
        } > nginx/conf.d/upstream.conf

  deploy:
    desc: GoアプリをビルドしてAPP_HOSTSへ配布・再起動
    preconditions: &no_active_run
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists; run task after-bench or task abort-run
    cmds:
      - task: build
      - task: deploy-app

  deploy-all:
    desc: sysctl・MySQL・アプリ・nginxを初期化なしで反映
    preconditions: *no_active_run
    cmds:
      - task: gen
      - task: build
      - task: deploy-plan
        vars: { PLAN: deploy-all }

  deploy-app-dry:
    desc: app deployの転送先・role・activationを実行せず表示
    deps: [build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl apply app -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-all-dry:
    desc: deploy-allの転送先・role・activation graphを実行せず表示
    deps: [build-deployctl]
    cmds:
      - task: gen
      - task: build
      - '{{.DEPLOYCTL_DIR}}/deployctl apply-plan deploy-all -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-app:
    desc: アプリをAPP_HOSTSへ配布・再起動
    preconditions: *no_active_run
    deps: [build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl apply app -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-nginx:
    desc: nginx設定をNGINX_HOSTSへ配布・reload
    preconditions: *no_active_run
    deps: [build-deployctl]
    cmds:
      - task: gen
      - '{{.DEPLOYCTL_DIR}}/deployctl apply nginx -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-mysql:
    desc: MySQL設定をMYSQL_HOSTSへ配布・restart
    preconditions: *no_active_run
    deps: [build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl apply mysql -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-sysctl:
    desc: sysctl設定を全ホストへ配布・反映
    preconditions: *no_active_run
    deps: [build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl apply sysctl -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-plan:
    internal: true
    deps: [build-deployctl]
    requires: { vars: [PLAN] }
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl apply-plan {{.PLAN}} -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  apply-roles:
    desc: 役割外サービスを停止し、役割内サービスを起動
    preconditions: *no_active_run
    deps: [build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl apply-plan roles -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-nginx-oncpu-prereqs:
    desc: optional profiler用perf packageをNGINX_ONCPU_HOSTへ一時導入
    preconditions: *no_active_run
    cmds:
      - '{{.SSH}} {{.SSH_USER}}@{{.NGINX_ONCPU_HOST}} "bash -s -- install {{.NGINX_ONCPU_HOST}}" < tools/bench/nginx-oncpu-prereqs.sh'

  deploy-nginx-oncpu-prereqs-check:
    desc: optional profilerをNGINX_ONCPU_HOSTでpreflight
    preconditions: *no_active_run
    deps: [build-nginx-oncpu-profiler]
    cmds:
      - '{{.RSYNC}} {{.NGINX_ONCPU_PROFILER_DIR}}/nginx-oncpu-profiler {{.SSH_USER}}@{{.NGINX_ONCPU_HOST}}:/tmp/isucon-nginx-oncpu-prereqs/profiler'
      - '{{.SSH}} {{.SSH_USER}}@{{.NGINX_ONCPU_HOST}} "bash -s -- check {{.NGINX_ONCPU_HOST}} {{.NGINX_ONCPU_PROBE_URL}}" < tools/bench/nginx-oncpu-prereqs.sh'

  deploy-nginx-oncpu-prereqs-cleanup:
    desc: optional profiler用に追加したperf packageだけを撤去
    preconditions: *no_active_run
    cmds:
      - '{{.SSH}} {{.SSH_USER}}@{{.NGINX_ONCPU_HOST}} "bash -s -- cleanup {{.NGINX_ONCPU_HOST}}" < tools/bench/nginx-oncpu-prereqs.sh'

  check-network:
    desc: nginx→appとapp→MySQLのTCP疎通を確認
    silent: true
    cmds:
      - for: { var: NGINX_HOSTS }
        cmd: '{{.SSH}} {{.SSH_USER}}@{{.ITEM}} "for ip in {{.APP_IPS}}; do timeout 2 bash -c \"</dev/tcp/\$ip/{{.LISTEN_PORT}}\"; done" && echo "[{{.ITEM}}] app OK"'
      - for: { var: APP_HOSTS }
        cmd: '{{.SSH}} {{.SSH_USER}}@{{.ITEM}} "timeout 2 bash -c \"</dev/tcp/{{.MYSQL_IP}}/3306\"" && echo "[{{.ITEM}}] mysql OK"'

  check-roles:
    desc: service状態がTaskfileの役割定義と一致することを確認
    deps: [build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl check-roles {{.DEPLOYCTL_COMMON}}'

  bench:
    desc: 計測開始→BENCH_HOSTでベンチ→回収
    env: &bench_runner_env
      ISUCON_BENCH_RUN_STATE_FILE: '{{.RUN_STATE_FILE}}'
      ISUCON_BENCH_RESULTS_DIR: '{{.RESULT_DIR}}'
      ISUCON_BENCH_COLLECT_FLAGS: '{{default "" .MEASURECTL_COLLECT_FLAGS}}'
      ISUCON_BENCH_PROFILES_ENABLED: '{{.PROFILES_ENABLED}}'
    cmds:
      - >-
        sh tools/bench/run.sh auto -- {{.SSH}} {{.SSH_USER}}@{{.BENCH_HOST}}
        "sudo -u {{.ISUCON_USER}} -i bash -lc 'cd {{.REMOTE_HOME}} && {{.BENCH_COMMAND}}'"

  bench-no-collectors:
    desc: collector負荷比較用に標準collectorを止めてベンチ・ログ回収
    cmds:
      - task: bench
        vars: { MEASURECTL_COLLECT_FLAGS: -no-collectors, PROFILES_ENABLED: 'false' }

  bench-manual:
    desc: 計測開始後、ユーザーによるベンチ実行と結果入力を待って回収
    interactive: true
    env: *bench_runner_env
    cmds:
      - sh tools/bench/run.sh manual

  bench-manual-no-collectors:
    desc: ポータルベンチでcollector負荷を比較するため標準collectorを無効化
    interactive: true
    cmds:
      - task: bench-manual
        vars: { MEASURECTL_COLLECT_FLAGS: -no-collectors, PROFILES_ENABLED: 'false' }

  before-bench:
    desc: RUNを採番し、ログローテートとcollector起動を行う
    silent: true
    deps: [build-measurectl, build-proc-metrics, build-mysql-metrics]
    cmds:
      - |
        bash <<'BASH'
        set -eu
        mkdir -p '{{.RAW_DIR}}'
        snapshot='{{.RAW_DIR}}/applied-snapshot-{{.RUN_ID}}.json'
        trap 'rm -f "$snapshot"' EXIT HUP INT TERM
        (cd tools/backlog && go run . -root '{{.ROOT_DIR}}' -db '{{.ROOT_DIR}}/{{.BACKLOG_DB}}' snapshot-applied --output '{{.ROOT_DIR}}/'"$snapshot")
        {{.MEASURECTL_DIR}}/measurectl run begin -run-id '{{.RUN_ID}}' \
          -profiles-enabled={{.PROFILES_ENABLED}} \
          -results '{{.RESULT_DIR}}' -raw-dir '{{.RAW_DIR}}' -run-state-file '{{.RUN_STATE_FILE}}' \
          -applied-snapshot "$snapshot" -compare-run '{{.COMPARE_RUN}}' \
          -compare-allow-cards '{{.COMPARE_ALLOWED_CARDS}}' -compare-allow-roles '{{.COMPARE_ALLOWED_ROLES}}' \
          -collector-flags '{{.MEASURECTL_FLAGS}} {{default "" .MEASURECTL_COLLECT_FLAGS}}' {{.MEASURECTL_REMOTE}}
        BASH

  after-bench:
    desc: 進行中RUNのcollector・ログ・集計・manifestを回収
    deps: [build-measurectl, build-nginx-backend-report, build-user-transition-metrics]
    vars:
      FINISH_RUN_ID:
        sh: sh tools/bench/active-run-id.sh '{{.RUN_STATE_FILE}}'
    cmds:
      - >-
        {{.MEASURECTL_DIR}}/measurectl run finalize -auto-commit -results '{{.RESULT_DIR}}' -raw-dir '{{.RAW_DIR}}'
        -run-state-file '{{.RUN_STATE_FILE}}' -scores '{{.RESULT_DIR}}/scores.tsv' -score '{{.SCORE}}'
        -collector-flags '{{.MEASURECTL_FLAGS}} {{default "" .MEASURECTL_COLLECT_FLAGS}}'
        -digester-flags '{{.MEASURECTL_DIGEST_FLAGS}}' {{.MEASURECTL_REMOTE}}
      - '{{.MEASURECTL_DIR}}/measurectl artifacts -run-dir {{.RESULT_DIR}}/{{.FINISH_RUN_ID}}'

  profiles-collect:
    desc: 進行中RUNへ標準Go profileとfgprofを収集
    deps: [build-measurectl]
    vars:
      ACTIVE_RUN_ID:
        sh: sh tools/bench/active-run-id.sh '{{.RUN_STATE_FILE}}'
    cmds: ['{{.MEASURECTL_DIR}}/measurectl collect oneshot -group profiles -run-id {{.ACTIVE_RUN_ID}} -run-dir {{.RESULT_DIR}}/{{.ACTIVE_RUN_ID}} {{.MEASURECTL_REMOTE}}']

  profiles-ready:
    desc: 進行中RUNのCPU・fgprof開始を全APP_HOSTSで確認
    deps: [build-measurectl]
    vars:
      ACTIVE_RUN_ID:
        sh: sh tools/bench/active-run-id.sh '{{.RUN_STATE_FILE}}'
    cmds: ['{{.MEASURECTL_DIR}}/measurectl collect ready -group profiles -run-id {{.ACTIVE_RUN_ID}} {{.MEASURECTL_REMOTE}}']

  fgprof-collect:
    desc: 進行中RUNへfgprofを収集
    deps: [build-measurectl]
    vars:
      ACTIVE_RUN_ID:
        sh: sh tools/bench/active-run-id.sh '{{.RUN_STATE_FILE}}'
    cmds: ['{{.MEASURECTL_DIR}}/measurectl collect oneshot -only fgprof -run-id {{.ACTIVE_RUN_ID}} -run-dir {{.RESULT_DIR}}/{{.ACTIVE_RUN_ID}} {{.MEASURECTL_COMMON}}']

  go-profiles-collect:
    desc: 進行中RUNへGo CPU・heap・allocs・goroutine profileを並列収集
    deps: [build-measurectl]
    vars:
      ACTIVE_RUN_ID:
        sh: sh tools/bench/active-run-id.sh '{{.RUN_STATE_FILE}}'
    cmds: ['{{.MEASURECTL_DIR}}/measurectl collect oneshot -only go-cpu,go-heap,go-allocs,go-goroutine -run-id {{.ACTIVE_RUN_ID}} -run-dir {{.RESULT_DIR}}/{{.ACTIVE_RUN_ID}} {{.MEASURECTL_COMMON}}']

  go-profile-top:
    desc: 保存済みGo profileをgo tool pprof -topで表示（PROFILE=isucon-1-go-cpu.pprof）
    requires: { vars: [PROFILE] }
    preconditions:
      - sh: test -n '{{.RUN}}' -a -f '{{.RUN}}/{{.PROFILE}}'
        msg: 指定したGo profileがありません
    cmds: ['go tool pprof -top {{.RUN}}/{{.PROFILE}}']

  abort-run:
    desc: 進行中RUNを破棄しcollectorを掃除（破壊的）
    deps: [build-measurectl]
    cmds:
      - '{{.MEASURECTL_DIR}}/measurectl collect sweep {{.MEASURECTL_COMMON}}'
      - |
        if [ -f '{{.RUN_STATE_FILE}}' ]; then
          mv -f '{{.RUN_STATE_FILE}}' '{{.RAW_DIR}}/aborted-run-id'
        fi

  artifacts:
    desc: 成果物宣言と読み手の整合を確認
    deps: [build-measurectl]
    cmds:
      - '{{.MEASURECTL_DIR}}/measurectl artifacts -check'

  artifacts-run:
    desc: 指定RUN（既定は最新）の必須成果物が揃っていることを確認
    deps: [build-measurectl]
    preconditions:
      - sh: test -n '{{.RUN}}' -a -d '{{.RUN}}'
        msg: 確認可能なRUNがありません
    cmds:
      - '{{.MEASURECTL_DIR}}/measurectl artifacts -run-dir {{.RUN}}'

  backlog:
    desc: Objective・Constraint・Interventionを管理
    dir: tools/backlog
    cmds: ['go run . -root {{.ROOT_DIR}} -db {{.ROOT_DIR}}/{{.BACKLOG_DB}} {{.CLI_ARGS}}']

  pass:
    desc: 最新RUNのAPPLIED Interventionを安全条件付きでVALIDATEDへ昇格（例外はFORCE=true）
    silent: true
    dir: tools/backlog
    vars:
      TARGETS: '{{.CLI_ARGS | default "all"}}'
      FORCE: '{{.FORCE | default "false"}}'
    cmds:
      - >-
        go run . -root '{{.ROOT_DIR}}' -db '{{.ROOT_DIR}}/{{.BACKLOG_DB}}'
        pass '{{.TARGETS}}' --actor task:pass --reason 'benchmark result adopted'
        --force='{{.FORCE}}' --outcomes '{{.ROOT_DIR}}/{{.RESULT_DIR}}/outcomes.tsv'

  q:
    desc: RUN横断DuckDBクエリ
    deps: [q-sync]
    env:
      ISUCON_QUERY: '{{join " " .CLI_ARGS_LIST}}'
    cmds:
      - |
        if [ -n "$ISUCON_QUERY" ]; then
          duckdb '{{.ANALYSIS_DB}}' -c "$ISUCON_QUERY"
        else
          duckdb '{{.ANALYSIS_DB}}'
        fi

  q-sync:
    internal: true
    deps: [build-analysisctl]
    preconditions:
      - sh: find '{{.RESULT_DIR}}' -mindepth 1 -maxdepth 1 -type d -name '[0-9]*' | grep -q .
        msg: finalized RUNがありません。先にベンチ計測を回収してください
    cmds: ['{{.ANALYSISCTL_DIR}}/analysisctl sync -config {{.ANALYSIS_CONFIG}} -db {{.ANALYSIS_DB}} -results {{.RESULT_DIR}}']

  q-build:
    desc: 分析DBを全RUNから再構築
    deps: [build-analysisctl]
    preconditions:
      - sh: find '{{.RESULT_DIR}}' -mindepth 1 -maxdepth 1 -type d -name '[0-9]*' | grep -q .
        msg: finalized RUNがありません。先にベンチ計測を回収してください
    cmds: ['{{.ANALYSISCTL_DIR}}/analysisctl rebuild -config {{.ANALYSIS_CONFIG}} -db {{.ANALYSIS_DB}} -results {{.RESULT_DIR}}']

  topology-screen:
    desc: 保存済みaccess logをシャード候補ごとにオフライン集計
    dir: tools/topology-screen
    cmds: ['go run . -run-dir {{.ROOT_DIR}}/{{.RUN}} {{.CLI_ARGS}}']

  alp:
    desc: 指定RUN（既定は最新）のalp.txtを表示
    preconditions:
      - sh: test -n '{{.RUN}}' -a -f '{{.RUN}}/alp.txt'
        msg: alp.txtがあるRUNがありません
    cmds: ['cat {{.RUN}}/alp.txt']

  dashboard:
    desc: ローカル計測ダッシュボードを起動
    deps: [dashboard-server, dashboard-web]

  dashboard-server:
    internal: true
    dir: tools/dashboard/server
    cmds: ['go run . -root {{.ROOT_DIR}} -db {{.ROOT_DIR}}/{{.BACKLOG_DB}} -addr 127.0.0.1:8091']

  dashboard-web:
    internal: true
    dir: tools/dashboard/web
    cmds:
      - test -d node_modules || npm ci
      - DASHBOARD_API_TARGET=http://127.0.0.1:8091 npm run dev -- --host 127.0.0.1 --port 5173 --strictPort

  browser-install:
    desc: dashboard確認用Playwright CLIをローカルへ導入
    dir: '{{.BROWSER_TOOLS_DIR}}'
    cmds:
      - npm ci --cache '{{.ROOT_DIR}}/.task/npm-cache'
      - npx playwright-cli install-browser

  status:
    desc: 全ホストのサービス状態
    cmds:
      - for: { var: ALL_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} \
            "systemctl is-active {{.SERVICE}} nginx mysql | tr '\n' ' '; echo; uptime"

  logs:
    desc: APP_HOSTSのアプリログ
    cmds:
      - for: { var: APP_HOSTS }
        cmd: '{{.SSH}} {{.SSH_USER}}@{{.ITEM}} "sudo journalctl -u {{.SERVICE}} -n 80 --no-pager"'

  ssh:
    desc: 指定ホストへisuconユーザーでログイン（HOST=isucon-1）
    interactive: true
    vars: { HOST: '{{.HOST | default "isucon-1"}}' }
    cmds: ['{{.SSH}} -t {{.SSH_USER}}@{{.HOST}} "sudo -u {{.ISUCON_USER}} -i"']

  db:
    desc: MYSQL_HOSTのMySQLへ接続
    interactive: true
    cmds: ['{{.SSH}} -t {{.SSH_USER}}@{{.MYSQL_HOST}} "sudo mysql {{.DB_NAME}}"']

  clear-cache:
    desc: 古いログとAPTキャッシュを削除（破壊的。明示指示時のみ）
    cmds:
      - for: { var: ALL_HOSTS }
        cmd: '{{.SSH}} {{.SSH_USER}}@{{.ITEM}} "sudo journalctl --vacuum-size=10M && sudo apt-get clean"'
