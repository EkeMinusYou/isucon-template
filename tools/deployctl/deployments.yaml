# Generic deployment graph. Taskfile.yml owns concrete host roles and values.
deployments:
  app-unit:
    uploads:
      - label: systemd unit
        role: app
        local: 'etc/systemd/system/{var:service}.service'
        remote: '/etc/systemd/system/{var:service}.service'
        validate: 'sudo systemd-analyze verify /etc/systemd/system/{var:service}.service'
    activations:
      - label: reload unit and start stopped application
        role: app
        script: |
          set -eu
          sudo systemctl daemon-reload
          sudo systemctl start {var:service}
          sudo systemctl is-active --quiet {var:service}

  app:
    uploads:
      - label: application
        role: app
        local: '{var:app_dir}/'
        remote: '{var:remote_home}/{var:app_dir}/'
        delete: true
        excludes: ['node_modules', '*.pprof', 'default.pgo']
      - label: systemd unit
        role: app
        local: 'etc/systemd/system/{var:service}.service'
        remote: '/etc/systemd/system/{var:service}.service'
    activations:
      - label: restart application
        role: app
        script: |
          set -eu
          sudo chown -R {var:isucon_user}:{var:isucon_user} {var:remote_home}/{var:app_dir}
          sudo systemctl daemon-reload
          sudo systemctl restart {var:service}
          sudo systemctl is-active --quiet {var:service}

  nginx:
    uploads:
      - label: nginx configuration
        role: nginx
        local: nginx/
        remote: /etc/nginx/
        excludes: [tls/]
        delete: true
        validate: sudo nginx -t
    activations:
      - label: reload nginx
        role: nginx
        script: |
          set -eu
          if sudo systemctl is-active --quiet nginx; then
            sudo systemctl reload nginx
          else
            sudo systemctl enable --now nginx
          fi
          sudo systemctl is-active --quiet nginx

  mysql:
    uploads:
      - label: MySQL configuration
        role: mysql
        local: mysql/
        remote: /etc/mysql/
        excludes: [debian.cnf]
        delete: true
        validate: sudo mysqld --validate-config
      - label: MySQL systemd limits
        role: mysql
        local: etc/systemd/system/mysql.service.d/
        remote: /etc/systemd/system/mysql.service.d/
    activations:
      - label: restart MySQL
        role: mysql
        script: |
          set -eu
          sudo systemctl daemon-reload
          sudo systemctl restart mysql
          sudo systemctl is-active --quiet mysql

  sysctl:
    uploads:
      - label: sysctl configuration
        role: all
        local: etc/sysctl.conf
        remote: /etc/sysctl.conf
    activations:
      - label: apply sysctl
        role: all
        script: |
          set -eu
          sudo sysctl -p >/dev/null

  app-stop:
    activations:
      - label: stop application writers before reset
        role: app
        script: |
          set -eu
          # The reset graph accepts only a confirmed absent or stopped unit.
          state=$(sudo systemctl show {var:service} -p LoadState -p ActiveState -p SubState -p MainPID)
          if printf '%s\n' "$state" | grep -qx 'LoadState=not-found'; then
            printf '%s\n' "$state" | grep -qx 'ActiveState=inactive'
            printf '%s\n' "$state" | grep -qx 'SubState=dead'
            printf '%s\n' "$state" | grep -qx 'MainPID=0'
            echo 'Application unit not installed; no process to retain a cache'
          else
            sudo systemctl stop {var:service}
            state=$(sudo systemctl show {var:service} -p LoadState -p ActiveState -p SubState -p MainPID)
            printf '%s\n' "$state" | grep -qx 'LoadState=loaded'
            printf '%s\n' "$state" | grep -qx 'ActiveState=inactive'
            printf '%s\n' "$state" | grep -qx 'SubState=dead'
            printf '%s\n' "$state" | grep -qx 'MainPID=0'
          fi

  app-start:
    activations:
      - label: start application after DB recreation
        role: app
        script: |
          set -eu
          sudo systemctl start '{var:service}'
          sudo systemctl is-active --quiet '{var:service}'

  db-schema:
    uploads:
      - label: SQL schema assets
        role: app_db
        local: '{var:sql_dir}/'
        remote: '{var:remote_home}/{var:sql_dir}/'
        delete: true
    activations:
      - label: recreate application database from the acquired schema
        role: app_db
        script: |
          set -eu
          test -f '{var:remote_home}/{var:sql_dir}/{var:sql_schema_file}'
          sudo mysql -e 'DROP DATABASE IF EXISTS `{var:db_name}`; CREATE DATABASE `{var:db_name}`;'
          sudo mysql '{var:db_name}' < '{var:remote_home}/{var:sql_dir}/{var:sql_schema_file}'

  app-initialize:
    activations:
      - label: initialize application data once
        role: app_init
        script: |
          set -eu
          curl --fail-with-body --silent --show-error --max-time 120 -X POST 'http://127.0.0.1:{var:listen_port}{var:initialize_path}'

  roles-off:
    activations:
      - label: stop services outside assigned roles
        role: all
        script: |
          set -eu
          host='{host}'
          in_role() { case ",$2," in *",$1,"*) return 0 ;; *) return 1 ;; esac; }
          disable_unit() {
            unit="$1"
            if sudo systemctl cat "$unit" >/dev/null 2>&1; then
              sudo systemctl disable --now "$unit" >/dev/null
            fi
          }
          if ! in_role "$host" '{var:app_hosts}'; then disable_unit '{var:service}'; fi
          if ! in_role "$host" '{var:nginx_hosts}'; then disable_unit nginx; fi
          if ! in_role "$host" '{var:mysql_hosts}'; then disable_unit mysql; fi

  roles-on:
    activations:
      - label: start services assigned to roles
        role: all
        script: |
          set -eu
          host='{host}'
          in_role() { case ",$2," in *",$1,"*) return 0 ;; *) return 1 ;; esac; }
          enable_unit() {
            sudo systemctl enable --now "$1" >/dev/null
            sudo systemctl is-active --quiet "$1"
          }
          if in_role "$host" '{var:mysql_hosts}'; then enable_unit mysql; fi
          if in_role "$host" '{var:app_hosts}'; then enable_unit '{var:service}'; fi
          if in_role "$host" '{var:nginx_hosts}'; then enable_unit nginx; fi

plans:
  deploy-all:
    deployments:
      sysctl: {}
      mysql: {}
      app: {needs: [mysql]}
      nginx: {needs: [app]}
  db-recreate:
    deployments:
      app-stop: {}
      db-schema: {needs: [app-stop]}
      app-start: {needs: [db-schema]}
      app-initialize: {needs: [app-start]}
  roles:
    deployments:
      roles-off: {}
      roles-on: {needs: [roles-off]}
