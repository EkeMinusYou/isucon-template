# Generic deployment graph. Taskfile.yml owns concrete host roles and values.
deployments:
  app-unit:
    uploads:
      - label: systemd unit
        role: app
        local: 'etc/systemd/system/{var:service}.service'
        remote: '/etc/systemd/system/{var:service}.service'
        validate: 'sudo systemd-analyze verify /etc/systemd/system/{var:service}.service'
    activations:
      - label: reload unit and start stopped application
        role: app
        script: |
          set -eu
          sudo systemctl daemon-reload
          sudo systemctl start {var:service}
          sudo systemctl is-active --quiet {var:service}

  app:
    uploads:
      - label: application
        role: app
        local: '{var:app_dir}/'
        remote: '{var:remote_home}/{var:app_dir}/'
        delete: true
        excludes: ['node_modules', '*.pprof', 'default.pgo']
      - label: systemd unit
        role: app
        local: 'etc/systemd/system/{var:service}.service'
        remote: '/etc/systemd/system/{var:service}.service'
    activations:
      - label: restart application
        role: app
        script: |
          set -eu
          sudo chown -R {var:isucon_user}:{var:isucon_user} {var:remote_home}/{var:app_dir}
          sudo systemctl daemon-reload
          sudo systemctl restart {var:service}
          sudo systemctl is-active --quiet {var:service}

  nginx:
    uploads:
      - label: public static assets
        role: nginx
        local: '{var:static_dir}/'
        remote: '{var:static_remote_dir}/'
        delete: true
        excludes: [.gitkeep]
      - label: nginx service limits
        role: nginx
        local: etc/systemd/system/nginx.service.d/
        remote: /etc/systemd/system/nginx.service.d/
      - label: nginx configuration
        role: nginx
        local: nginx/
        remote: /etc/nginx/
        excludes: [tls/, mime.types, "*.key", "*.pem", "*.crt"]
        delete: true
        validate: sudo nginx -t
    activations:
      - label: reload nginx
        role: nginx
        script: |
          set -eu
          sudo systemctl daemon-reload
          if sudo systemctl is-active --quiet nginx; then
            pid=$(sudo systemctl show nginx -p MainPID --value)
            current=$(sudo awk '/Max open files/ {print $4}' "/proc/$pid/limits")
            configured=$(sudo systemctl show nginx -p LimitNOFILESoft --value)
            if [ "$current" = "$configured" ]; then
              sudo systemctl reload nginx
            else
              sudo systemctl restart nginx
            fi
          else
            sudo systemctl enable --now nginx
          fi
          sudo systemctl is-active --quiet nginx

  sysctl:
    uploads:
      - label: sysctl configuration
        role: all
        local: etc/sysctl.conf
        remote: /etc/sysctl.conf
    activations:
      - label: apply sysctl
        role: all
        script: |
          set -eu
          sudo sysctl -p >/dev/null

  app-initialize:
    activations:
      - label: initialize application data once
        role: app_init
        script: |
          set -eu
          curl --fail-with-body --silent --show-error --max-time 120 -X POST 'http://127.0.0.1:{var:listen_port}{var:initialize_path}'

  roles-off:
    activations:
      - label: stop unused services and unassigned nginx/Go services
        role: all
        script: |
          set -eu
          disable_unit() {
            if sudo systemctl cat "$1" >/dev/null 2>&1; then
              sudo systemctl disable --now "$1" >/dev/null
              state=$(sudo systemctl is-active "$1" 2>/dev/null || true)
              case "$state" in inactive|failed|unknown) ;; *) echo "$1 is still $state" >&2; exit 1;; esac
            fi
          }
          for unit in $(printf '%s' '{var:disabled_services}' | tr ',' ' '); do disable_unit "$unit"; done
          case ',{var:app_hosts},' in *',{host},'*) ;; *) disable_unit '{var:service}';; esac
          case ',{var:nginx_hosts},' in *',{host},'*) ;; *) disable_unit nginx;; esac

  roles-on:
    activations:
      - label: enable assigned nginx/Go services
        role: all
        script: |
          set -eu
          case ',{var:app_hosts},' in *',{host},'*)
            sudo systemctl enable --now '{var:service}'
            sudo systemctl is-active --quiet '{var:service}'
            ;; esac
          case ',{var:nginx_hosts},' in *',{host},'*)
            sudo systemctl enable --now nginx
            sudo systemctl is-active --quiet nginx
            ;; esac

plans:
  deploy-all:
    deployments:
      roles-off: {}
      sysctl: {needs: [roles-off]}
      app: {needs: [roles-off]}
      nginx: {needs: [app]}
      roles-on: {needs: [nginx]}
  initialize:
    deployments:
      app-initialize: {}
  roles:
    deployments:
      roles-off: {}
      roles-on: {needs: [roles-off]}
