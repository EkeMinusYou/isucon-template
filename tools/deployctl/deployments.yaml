# Generic deployment graph. Taskfile.yml owns concrete host roles and values.
deployments:
  app-unit:
    uploads:
      - label: systemd unit
        role: app
        local: 'generated/systemd/{var:service}.service'
        remote: '/etc/systemd/system/{var:service}.service'
        validate: 'sudo systemd-analyze verify /etc/systemd/system/{var:service}.service'
    activations:
      - label: reload unit and start stopped application
        role: app
        script: |
          set -eu
          sudo systemctl daemon-reload
          sudo systemctl start {var:service}
          sudo systemctl is-active --quiet {var:service}
        ready:
          url: http://127.0.0.1:{var:listen_port}/healthz
          timeout: 30s

  app:
    uploads:
      - label: application
        role: app
        local: '{var:app_dir}/'
        remote: '{var:remote_home}/{var:app_dir}/'
        delete: true
        excludes: ['node_modules', '*.pprof', 'default.pgo']
      - label: systemd unit
        role: app
        local: 'generated/systemd/{var:service}.service'
        remote: '/etc/systemd/system/{var:service}.service'
    activations:
      - label: restart application
        role: app
        script: |
          set -eu
          sudo chown -R {var:isucon_user}:{var:isucon_user} {var:remote_home}/{var:app_dir}
          sudo install -d -m 0775 -o {var:isucon_user} -g {var:isucon_user} {var:access_log_dir}
          sudo systemctl daemon-reload
          sudo systemctl restart {var:service}
          sudo systemctl is-active --quiet {var:service}
        ready:
          url: http://127.0.0.1:{var:listen_port}/healthz
          timeout: 30s

  static:
    uploads:
      - label: public static assets
        role: app
        local: '{var:static_dir}/'
        remote: '{var:static_remote_dir}/'
        delete: true
        excludes: [.gitkeep]
    activations:
      - label: make static assets readable by Go
        role: app
        script: sudo chown -R {var:isucon_user}:{var:isucon_user} {var:static_remote_dir}

  tls:
    uploads:
      - label: private TLS material
        role: app
        local: tls/
        remote: '{var:tls_remote_dir}/'
        excludes: [.gitkeep]
    activations:
      - label: restrict TLS material to the application user
        role: app
        script: |
          set -eu
          sudo chown -R {var:isucon_user}:{var:isucon_user} {var:tls_remote_dir}
          sudo chmod 700 {var:tls_remote_dir}
          sudo find {var:tls_remote_dir} -type f -exec chmod 600 {} +

  sysctl:
    uploads:
      - label: sysctl configuration
        role: all
        local: etc/sysctl.conf
        remote: /etc/sysctl.conf
    activations:
      - label: apply sysctl
        role: all
        script: |
          set -eu
          sudo sysctl -p >/dev/null

  app-initialize:
    activations:
      - label: initialize application data once
        role: app_init
        script: |
          set -eu
          curl --fail-with-body --silent --show-error --max-time 120 -X POST 'http://127.0.0.1:{var:listen_port}{var:initialize_path}'

  roles-off:
    activations:
      - label: stop unused services and unassigned Go services
        role: all
        script: |
          set -eu
          disable_unit() {
            if sudo systemctl cat "$1" >/dev/null 2>&1; then
              sudo systemctl disable --now "$1" >/dev/null
              state=$(sudo systemctl is-active "$1" 2>/dev/null || true)
              case "$state" in inactive|failed|unknown) ;; *) echo "$1 is still $state" >&2; exit 1;; esac
            fi
          }
          for unit in $(printf '%s' '{var:disabled_services}' | tr ',' ' '); do disable_unit "$unit"; done
          case ',{var:app_hosts},' in *',{host},'*) ;; *) disable_unit '{var:service}';; esac

  roles-on:
    activations:
      - label: enable assigned Go services
        role: all
        script: |
          set -eu
          case ',{var:app_hosts},' in *',{host},'*)
            sudo systemctl enable --now '{var:service}'
            sudo systemctl is-active --quiet '{var:service}'
            ;; esac

plans:
  deploy-all:
    deployments:
      roles-off: {}
      sysctl: {needs: [roles-off]}
      static: {needs: [roles-off]}
      tls: {needs: [roles-off]}
      app: {needs: [static, tls]}
      roles-on: {needs: [app]}
  initialize:
    deployments:
      app-initialize: {}
  roles:
    deployments:
      roles-off: {}
      roles-on: {needs: [roles-off]}
