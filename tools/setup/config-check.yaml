# Uploads replace live configuration files without reloading services.
# Adapt additional services and host-specific overlays during setup.
deployments:
  config-check:
    uploads:
      - label: nginx configuration
        role: nginx
        local: nginx/
        remote: /etc/nginx/
        excludes: [tls/]
        delete: true
        validate: sudo nginx -t
      - label: MySQL configuration
        role: mysql
        local: mysql/
        remote: /etc/mysql/
        excludes: [debian.cnf]
        delete: true
        validate: sudo mysqld --validate-config
