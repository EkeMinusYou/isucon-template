# Optional config-only upload. Valid settings remain at the live paths;
# each failed upload is restored before deployctl returns an error.
deployments:
  config-check:
    uploads:
      - label: nginx configuration
        role: nginx
        local: nginx/
        remote: /etc/nginx/
        delete: true
        validate: sudo nginx -t
      - label: MySQL configuration
        role: mysql
        local: mysql/
        remote: /etc/mysql/
        delete: true
        validate: sudo mysqld --validate-config
