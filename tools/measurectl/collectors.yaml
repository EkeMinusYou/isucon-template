# Remote operations for one benchmark run. Host names are role names resolved
# by Taskfile.yml through measurectl's -role flags.
prepare:
  - name: nginx-log
    label: nginx access log
    hosts: nginx
    script: |
      set -eu
      log=/var/log/nginx/access.log
      if sudo test -e "$log"; then
        sudo mv -f "$log" "${log}.old"
      fi
      error_log=/var/log/nginx/error.log
      if sudo test -e "$error_log"; then
        sudo mv -f "$error_log" "${error_log}.old"
      fi
      sudo nginx -s reopen
      echo "nginx access and error logs rotated"

  - name: mysql-log
    label: MySQL slow log and performance_schema digest
    hosts: mysql
    script: |
      set -eu
      log=/var/log/mysql/mysql-slow.log
      if sudo test -e "$log"; then
        sudo mv -f "$log" "${log}.old"
      fi
      sudo mysql -e 'FLUSH SLOW LOGS'
      sudo rm -f "${log}.old"
      if sudo mysql -N -e 'SELECT @@performance_schema' 2>/dev/null | grep -q '^1$'; then
        sudo mysql -e 'TRUNCATE TABLE performance_schema.events_statements_summary_by_digest'
      fi
      echo "MySQL logs rotated"

oneshots:
  - name: fgprof
    label: wall-clock profile
    enabled_by_default: false
    hosts: app
    delay: '{var:profile_delay}'
    run: curl -fsS --max-time {var:profile_timeout_seconds} -o {remote_out} '{var:fgprof_url}&run_id={run_id}'
    ready: |
      set -eu
      deadline=$(( $(date +%s) + {var:profile_ready_timeout_seconds} ))
      until curl -fsS --max-time 1 '{var:profile_status_url}' | grep -Fq '"fgprof":"{run_id}"'; do
        if [ "$(date +%s)" -ge "$deadline" ]; then echo 'fgprof did not start for this RUN' >&2; exit 1; fi
        sleep 0.1
      done
    remote_out: /tmp/isucon-{run_id}-fgprof.pprof
    output: '{host}-fgprof.pprof'

  - name: go-cpu
    label: Go CPU profile
    enabled_by_default: false
    hosts: app
    delay: '{var:profile_delay}'
    run: curl -fsS --max-time {var:profile_timeout_seconds} -o {remote_out} '{var:pprof_base_url}/profile?seconds={var:profile_seconds}&run_id={run_id}'
    ready: |
      set -eu
      deadline=$(( $(date +%s) + {var:profile_ready_timeout_seconds} ))
      until curl -fsS --max-time 1 '{var:profile_status_url}' | grep -Fq '"cpu":"{run_id}"'; do
        if [ "$(date +%s)" -ge "$deadline" ]; then echo 'CPU profile did not start for this RUN' >&2; exit 1; fi
        sleep 0.1
      done
    remote_out: /tmp/isucon-{run_id}-go-cpu.pprof
    output: '{host}-go-cpu.pprof'

  - name: go-heap
    label: Go heap profile
    enabled_by_default: false
    hosts: app
    delay: '{var:snapshot_profile_delay}'
    run: curl -fsS --max-time 15 -o {remote_out} '{var:pprof_base_url}/heap'
    remote_out: /tmp/isucon-{run_id}-go-heap.pprof
    output: '{host}-go-heap.pprof'

  - name: go-allocs
    label: Go allocation profile
    enabled_by_default: false
    hosts: app
    delay: '{var:snapshot_profile_delay}'
    run: curl -fsS --max-time 15 -o {remote_out} '{var:pprof_base_url}/allocs'
    remote_out: /tmp/isucon-{run_id}-go-allocs.pprof
    output: '{host}-go-allocs.pprof'

  - name: go-goroutine
    label: Go goroutine profile
    enabled_by_default: false
    hosts: app
    delay: '{var:snapshot_profile_delay}'
    run: curl -fsS --max-time 15 -o {remote_out} '{var:pprof_base_url}/goroutine'
    remote_out: /tmp/isucon-{run_id}-go-goroutine.pprof
    output: '{host}-go-goroutine.pprof'

collectors:
  - name: proc
    label: host and service metrics
    hosts: all
    binary: tools/proc-metrics/proc-metrics
    remote_root: /tmp/isucon-proc-metrics
    stdout: '{remote_dir}/metrics.tsv'
    args: >-
      -interval 1s
      -services {var:services}
      -service-output {remote_dir}/service-metrics.tsv
      -disk-output {remote_dir}/disk-metrics.tsv
    outputs:
      metrics.tsv: '{host}-proc-metrics.tsv'
      service-metrics.tsv: '{host}-service-metrics.tsv'
      disk-metrics.tsv: '{host}-disk-metrics.tsv'
    stderr: '{host}-proc-metrics.stderr'

  - name: task-state
    label: high-frequency blocked task state
    enabled_by_default: false
    hosts: all
    binary: tools/proc-metrics/proc-metrics
    remote_root: /tmp/isucon-task-state
    stdout: /dev/null
    args: >-
      -interval 10s
      -services ''
      -task-output {remote_dir}/task-states.tsv
      -task-interval 250ms
    outputs:
      task-states.tsv: '{host}-task-states.tsv'
    stderr: '{host}-task-states.stderr'

  - name: mysql
    label: MySQL status
    hosts: mysql
    binary: tools/mysql-metrics/mysql-metrics
    remote_root: /tmp/isucon-mysql-metrics
    stdout: /dev/null
    args: >-
      -interval 1s
      -output {remote_dir}/metrics.tsv
    outputs:
      metrics.tsv: mysql-status.tsv
    stderr: mysql-status.stderr

  - name: mysql-locks
    label: high-frequency MySQL lock waits
    enabled_by_default: false
    hosts: mysql
    binary: tools/mysql-metrics/mysql-metrics
    remote_root: /tmp/isucon-mysql-locks
    stdout: /dev/null
    args: >-
      -interval 10s
      -output /dev/null
      -lock-output {remote_dir}/lock-waits.tsv
      -lock-interval 50ms
      -lock-query-timeout 40ms
    outputs:
      lock-waits.tsv: mysql-lock-waits.tsv
    stderr: mysql-lock-waits.stderr

  - name: nginx-oncpu
    label: nginx worker on-CPU profile
    enabled_by_default: false
    hosts: nginx_profile
    binary: tools/nginx-oncpu-profiler/nginx-oncpu-profiler
    remote_root: /tmp/isucon-nginx-oncpu
    stdout: /dev/null
    args: >-
      -delay 10s -duration 60s -frequency 49 -max-workers 8
      -max-samples 23520 -max-output-bytes 67108864 -call-graph dwarf,8192
      -folded-output {remote_dir}/nginx-oncpu.folded
      -metadata-output {remote_dir}/nginx-oncpu-metadata.json
      -raw-output {remote_dir}/nginx-oncpu.data
    outputs:
      nginx-oncpu.folded: '{host}-nginx-oncpu.folded'
      nginx-oncpu-metadata.json: '{host}-nginx-oncpu-metadata.json'
    stderr: '{host}-nginx-oncpu.stderr'
