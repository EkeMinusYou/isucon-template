# Remote operations for one benchmark run. Host names are role names resolved
# by Taskfile.yml through measurectl's -role flags.
prepare:
  - name: access-log
    label: Go access log
    hosts: ingress
    script: |
      set -eu
      sudo test -f '{var:access_log_path}'
      sudo truncate -s 0 '{var:access_log_path}'

oneshots:
  - name: fgprof
    label: wall-clock profile
    group: profiles
    enabled_by_default: false # Collect explicitly with task fgprof-collect.
    hosts: app
    delay: '{var:profile_delay}'
    run: curl -fsS --max-time {var:profile_timeout_seconds} -o {remote_out} '{var:fgprof_url}&run_id={run_id}'
    stop: curl -fsS --max-time 5 -X POST '{var:profile_stop_url}?kind=fgprof&run_id={run_id}'
    ready: |
      set -eu
      deadline=$(( $(date +%s) + {var:profile_ready_timeout_seconds} ))
      until curl -fsS --max-time 1 '{var:profile_status_url}' | grep -Fq '"fgprof":"{run_id}"'; do
        if [ "$(date +%s)" -ge "$deadline" ]; then echo 'fgprof did not start for this RUN' >&2; exit 1; fi
        sleep 0.1
      done
    remote_out: /tmp/isucon-{run_id}-fgprof.pprof
    output: '{host}-fgprof.pprof'

  - name: go-cpu
    label: Go CPU profile
    group: profiles
    enabled_by_default: true
    hosts: app
    delay: '{var:profile_delay}'
    run: curl -fsS --max-time {var:profile_timeout_seconds} -o {remote_out} '{var:pprof_base_url}/profile?seconds={var:profile_seconds}&run_id={run_id}'
    stop: curl -fsS --max-time 5 -X POST '{var:profile_stop_url}?kind=cpu&run_id={run_id}'
    ready: |
      set -eu
      deadline=$(( $(date +%s) + {var:profile_ready_timeout_seconds} ))
      until curl -fsS --max-time 1 '{var:profile_status_url}' | grep -Fq '"cpu":"{run_id}"'; do
        if [ "$(date +%s)" -ge "$deadline" ]; then echo 'CPU profile did not start for this RUN' >&2; exit 1; fi
        sleep 0.1
      done
    remote_out: /tmp/isucon-{run_id}-go-cpu.pprof
    output: '{host}-go-cpu.pprof'

  - name: go-snapshots
    label: Go heap, allocation and goroutine time series
    group: profiles
    enabled_by_default: true
    hosts: app
    run: curl -fsS --max-time {var:profile_timeout_seconds} -o {remote_out} '{var:snapshot_profile_url}?seconds={var:profile_seconds}&run_id={run_id}'
    stop: curl -fsS --max-time 5 -X POST '{var:profile_stop_url}?kind=snapshots&run_id={run_id}'
    ready: |
      set -eu
      deadline=$(( $(date +%s) + {var:profile_ready_timeout_seconds} ))
      until curl -fsS --max-time 1 '{var:profile_status_url}' | grep -Fq '"snapshots":"{run_id}"'; do
        if [ "$(date +%s)" -ge "$deadline" ]; then echo 'snapshot recording did not start for this RUN' >&2; exit 1; fi
        sleep 0.1
      done
    remote_out: /tmp/isucon-{run_id}-go-snapshots.tar
    output: '{host}-go-snapshots.tar'

collectors:
  - name: proc
    label: host and service metrics
    hosts: all
    binary: tools/measurement/cmd/proc-metrics/proc-metrics
    remote_root: /tmp/isucon-proc-metrics
    stdout: '{remote_dir}/metrics.tsv'
    args: >-
      -interval 1s
      -services {var:services}
      -service-output {remote_dir}/service-metrics.tsv
      -disk-output {remote_dir}/disk-metrics.tsv
    outputs:
      metrics.tsv: '{host}-proc-metrics.tsv'
      service-metrics.tsv: '{host}-service-metrics.tsv'
      disk-metrics.tsv: '{host}-disk-metrics.tsv'
    stderr: '{host}-proc-metrics.stderr'

  - name: task-state
    label: high-frequency blocked task state
    enabled_by_default: false
    hosts: all
    binary: tools/measurement/cmd/proc-metrics/proc-metrics
    remote_root: /tmp/isucon-task-state
    stdout: /dev/null
    args: >-
      -interval 10s
      -services ''
      -task-output {remote_dir}/task-states.tsv
      -task-interval 250ms
    outputs:
      task-states.tsv: '{host}-task-states.tsv'
    stderr: '{host}-task-states.stderr'

  - name: runtime
    label: Go runtime metrics
    hosts: app
    binary: tools/measurement/cmd/runtime-metrics/runtime-metrics
    remote_root: /tmp/isucon-runtime-metrics
    stdout: /dev/null
    args: >-
      -endpoint {var:runtime_metrics_url}
      -interval 1s
      -output {remote_dir}/metrics.tsv
    outputs:
      metrics.tsv: '{host}-runtime-metrics.tsv'
    stderr: '{host}-runtime-metrics.stderr'

  - name: application-json
    label: bounded application JSON metrics
    enabled_by_default: false
    hosts: app
    binary: tools/measurement/cmd/json-metrics-collector/json-metrics-collector
    remote_root: /tmp/isucon-application-json-metrics
    stdout: /dev/null
    args: >-
      -enable-endpoint {var:application_metrics_enable_url}
      -snapshot-endpoint {var:application_metrics_snapshot_url}
      -disable-endpoint {var:application_metrics_disable_url}
      -interval 1s
      -output {remote_dir}/metrics.tsv
    outputs:
      metrics.tsv: '{host}-json-metrics.tsv'
    stderr: '{host}-application-json-metrics.stderr'
