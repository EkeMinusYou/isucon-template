# ベンチ後の集計の宣言。measurectl digest がこれを読んで、生ログの回収 → 集計 →
# 生ログの圧縮まで流す。
#
# 生ログ (sources) と集計 (digesters) を分けてあるのは、同じログを複数の集計が
# 読むため。access.log は alp と操作遷移集計の両方が使うので、回収は 1 回だけ行う。
#
# 使えるプレースホルダ:
#   {run_dir}  runs/<RUN_ID>
#   {raw_dir}  raw/ (走行をまたいで上書きする置き場)
#   {host}     回収元ホスト名 (sources のみ)
#   {input}    その集計の入力ファイル。複数あればすべて引数に展開される
#
# 集計コマンドの標準出力が outputs の file へ書き込まれる。stdin を宣言した集計は、
# そのコマンドで入力を読んで集計コマンドの標準入力へつなぐ。

# 回収する生ログ。role は measurectl に -role で渡す役割名。
sources:
  - name: access
    role: app_traffic
    remote: '{var:access_log_path}'
    local: '{run_dir}/raw/access-{host}.log'
    # The Go logger flushes within one second.
    fetch_delay: 2s
    # 1 本 130MB 前後あるが zstd で 1/30 程度になる。集計が済んでから畳む。
    compress: true

digesters:
  - name: service-journal
    label: all managed service journals for benchmark window
    remote:
      role: all
      per_host: true
      script: |
        set -eu
        printf '# host={host} services={var:services} load_window={load_start}..{load_end}\n'
        for unit in $(printf '%s' '{var:services}' | tr ',' ' '); do
          printf '# unit=%s\n' "$unit"
          sudo journalctl -u "$unit" --since "$(date -u -d '{load_start}' '+%Y-%m-%d %H:%M:%S.%6N UTC')" --until "$(date -u -d '{load_end}' '+%Y-%m-%d %H:%M:%S.%6N UTC')" --no-pager -o short-iso-precise
        done
    stderr: '{host}-service-journal.stderr'
    outputs:
      - file: '{host}-service-journal.log'

  - name: app-journal
    label: application journal for benchmark window
    remote:
      role: app
      per_host: true
      script: |
        set -eu
        printf '# host={host} unit={var:app_service} load_window={load_start}..{load_end}\n'
        sudo journalctl -u '{var:app_service}' --since "$(date -u -d '{load_start}' '+%Y-%m-%d %H:%M:%S.%6N UTC')" --until "$(date -u -d '{load_end}' '+%Y-%m-%d %H:%M:%S.%6N UTC')" --no-pager -o short-iso-precise
    stderr: app-journal.stderr
    outputs:
      - file: '{host}-app-journal.log'

  - name: kernel-journal
    label: kernel journal for benchmark window
    remote:
      role: all
      per_host: true
      script: |
        set -eu
        printf '# host={host} kernel load_window={load_start}..{load_end}\n'
        sudo journalctl -k --since "$(date -u -d '{load_start}' '+%Y-%m-%d %H:%M:%S.%6N UTC')" --until "$(date -u -d '{load_end}' '+%Y-%m-%d %H:%M:%S.%6N UTC')" --no-pager -o short-iso-precise
    stderr: kernel-journal.stderr
    outputs:
      - file: '{host}-kernel.log'

  - name: oom-events
    label: OOM events for benchmark window
    remote:
      role: all
      per_host: true
      script: |
        set -eu
        printf '# host={host} OOM events load_window={load_start}..{load_end}\n'
        tmp=$(mktemp)
        trap 'rm -f "$tmp"' EXIT HUP INT TERM
        sudo journalctl -k --since "$(date -u -d '{load_start}' '+%Y-%m-%d %H:%M:%S.%6N UTC')" --until "$(date -u -d '{load_end}' '+%Y-%m-%d %H:%M:%S.%6N UTC')" --no-pager -o short-iso-precise > "$tmp"
        grep -E -i 'out of memory|oom-kill|killed process|memory cgroup out of memory' "$tmp" || true
    stderr: oom-events.stderr
    outputs:
      - file: '{host}-oom.log'

  - name: alp
    label: alp
    source: access
    stderr: alp.stderr
    # zstdcat は非圧縮ファイルもそのまま通すので、圧縮前後どちらの入力でも動く。
    stdin: zstdcat
    # alp は 1 回の実行で複数フォーマットを出せない。同じログを独立に舐めるだけなので
    # 並列に流す (直列だと素朴に 2 倍かかる)。
    outputs:
      - file: alp.txt
        run: alp json --config alp.yml
      - file: alp.json
        run: alp json --config alp.yml --format json
        # ダッシュボードが読む。壊れた JSON を置くより空配列のほうが扱いやすい。
        on_error: '[]'
        on_skip: '[]'

  - name: alp-by-ingress
    label: alp by ingress
    source: access
    stderr: alp-by-ingress.stderr
    outputs:
      - file: alp-by-ingress.tsv
        run: tools/analysis/alp-by-ingress.sh {input}
        on_error: "ingress_host\tcount\tmethod\turi\t2xx\t3xx\t4xx\t5xx\tmax\tavg\tsum\tp90\tp99\tsum_body\tavg_body"
        on_skip: "ingress_host\tcount\tmethod\turi\t2xx\t3xx\t4xx\t5xx\tmax\tavg\tsum\tp90\tp99\tsum_body\tavg_body"

  # Cookie values are used only while reading raw access logs. The artifact
  # contains aggregate edges between normalized APIs, never identities.
  # Requests from all HTTP entrances are merged by start time.
  - name: user-transitions
    enabled_by_default: true
    label: Cookie user transitions
    source: access
    stderr: user-transitions.stderr
    timeout: 120s
    outputs:
      - file: user-transitions.json
        run: tools/user-transition-metrics/user-transition-metrics -config tools/contest/user-transition-routes.json -output - {input}
        on_error: '{"schema_version":3,"identity_field":"session_id","ordering":"request_start_time; ties by response_end_time then input order","scenario_grouping":"exact set of normalized method-route nodes observed in one Cookie session","summary":{"input_files":0,"input_lines":0,"malformed_lines":0,"invalid_time_lines":0,"api_requests":0,"classified_requests":0,"unmatched_api_requests":0,"requests_with_identity":0,"missing_identity_requests":0,"sessions":0,"transitions":0,"overlapping_transitions":0,"ambiguous_order_transitions":0,"window_start_unix_ms":0,"window_end_unix_ms":0,"scenario_groups":0,"scenarios_emitted":0,"scenario_sessions_omitted":0},"edges":[],"scenarios":[]}'
        on_skip: '{"schema_version":3,"identity_field":"session_id","ordering":"request_start_time; ties by response_end_time then input order","scenario_grouping":"exact set of normalized method-route nodes observed in one Cookie session","summary":{"input_files":0,"input_lines":0,"malformed_lines":0,"invalid_time_lines":0,"api_requests":0,"classified_requests":0,"unmatched_api_requests":0,"requests_with_identity":0,"missing_identity_requests":0,"sessions":0,"transitions":0,"overlapping_transitions":0,"ambiguous_order_transitions":0,"window_start_unix_ms":0,"window_end_unix_ms":0,"scenario_groups":0,"scenarios_emitted":0,"scenario_sessions_omitted":0},"edges":[],"scenarios":[]}'
